id: no-raw-secret-replace
valid:
  # Replace outside a secret loop is a different (also banned) pattern, not
  # raw-secret iteration.
  - |
    fn f(text: &str, secret: &str) -> String {
        text.replace(secret, "x")
    }
  - |
    fn f(text: &str, secrets: &[String]) -> String {
        mask_secrets(text, secrets)
    }
invalid:
  - |
    fn f(text: &str, secrets: &[String]) -> String {
        let mut out = text.to_owned();
        for s in secrets {
            out = out.replace(s, "****");
        }
        out
    }
  - |
    fn f(text: &str, secrets: &[String]) -> String {
        let mut out = text.to_owned();
        for s in secrets {
            attempts += 1;
            out = out.replace(s, "****");
            seen += 1;
        }
        out
    }
