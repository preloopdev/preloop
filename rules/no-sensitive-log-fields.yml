        - pattern: $MACRO!($$$ARGS, token, $$$REST)
        - pattern: $MACRO!($$$ARGS, ?token, $$$REST)
        - pattern: $MACRO!($$$ARGS, %token, $$$REST)
        - pattern: $MACRO!($$$ARGS, authorization, $$$REST)
        - pattern: $MACRO!($$$ARGS, ?authorization, $$$REST)
        - pattern: $MACRO!($$$ARGS, %authorization, $$$REST)
