        - pattern: $MACRO!($$$ARGS, signed_url = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, ?signed_url = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, %signed_url = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, body = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, ?body = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, %body = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, payload = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, ?payload = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, %payload = $$$VALUE, $$$REST)
    # Normalize the macro path so qualified `tracing::info!`/`warn!`/`error!`
    # invocations match exactly like the unqualified forms. The regex runs
    # against the invocation's text, so `$MACRO` must resolve to exactly
    # `info`/`warn`/`error`, optionally `tracing::`-qualified — debug!/trace!
    # and unrelated macros stay out of scope.
    - regex: ^(tracing::)?(info|warn|error)!\(
