        # error!: assigned field in any position — plain, ?-debug, %-display.
        - pattern: $MACRO!($$$ARGS, token = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, ?token = $$$VALUE, $$$REST)
