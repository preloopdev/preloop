        - pattern: $MACRO!($$$ARGS, authorization = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, ?authorization = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, %authorization = $$$VALUE, $$$REST)
        - pattern: $MACRO!($$$ARGS, cookie = $$$VALUE, $$$REST)
