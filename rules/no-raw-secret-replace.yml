id: no-raw-secret-replace
message: |
  Iterating over secrets and calling .replace() bypasses the shared masker.
  Use aksh_gha_protocol::masking::mask_secrets() which guarantees
  longest-first ordering and empty-secret filtering.
severity: error
language: rust
ignores:
  - "**/masking.rs"
rule:
  pattern: |
    for $SECRET in $SECRETS {
      $$$BODY
      $TEXT = $TEXT.replace($SECRET, $$$ARGS);
      $$$REST
    }
