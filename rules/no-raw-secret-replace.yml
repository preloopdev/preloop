id: no-raw-secret-replace
message: |
  Iterating over secrets and calling .replace() bypasses the shared masker.
  Use preloop_gha_protocol::masking::mask_secrets() which guarantees
  longest-first ordering and empty-secret filtering.
severity: error
language: rust
ignores:
  - "**/masking.rs"
rule:
  all:
    # The per-secret replace statement on its own. Matching the statement
    # independently — instead of sandwiching it between `$$$BODY`/`$$$REST`
    # stretches inside the loop block — keeps loops matchable whatever else
    # the body contains before AND after the call.
    - pattern: $TEXT = $TEXT.replace($SECRET, $$$ARGS);
    # Tied to the loop by metavariable capture (same `$SECRET` must match
    # exactly): the replace needle has to be the loop variable, so `for
    # (token, value) in pairs { out = out.replace(token, …) }` cannot
    # false-match. `inside` defaults to stopBy: neighbor (direct parent
    # only), so search the full ancestor chain to reach the for loop.
    - inside:
        pattern: for $SECRET in $SECRETS { $$$BODY }
        stopBy: end
