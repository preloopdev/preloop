SPECIFICATION Spec

CONSTANTS
    \* Sets
    Runner = {r1, r2}
    Session = {s1, s2}
    RunId = {run1, run2}
    JobId = {job1, job2, job3}
    RequestId = {1, 2, 3, 4, 5, 6, 7, 8}
    Key = {g1, g2}
    JobSetId = {js1}
    StepId = {st1, st2}
    Str = {"s1", "s2"}

    \* Sentinel and parameters
    NoRun = norun
    NoJob = nojob
    NoRunner = norunner
    NoKey = nokey
    MESSAGE_ID_BASE = 1000000
    MaxLowMsgs = 12
    MaxHighMsgs = 4
    LeaseSeconds = 3
    JobTimeout = 4
    MaxOutputBytes = 1048576
    MaxChunk = 4
    RequireAssignments = FALSE

    \* Status tags
    StQueued = "StQueued"
    StPending = "StPending"
    StInProgress = "StInProgress"
    StSuccess = "StSuccess"
    StFailure = "StFailure"
    StCancelled = "StCancelled"
    StSkipped = "StSkipped"

    \* Request states
    SNone = "SNone"
    SQueued = "SQueued"
    SClaimed = "SClaimed"
    SAcquiring = "SAcquiring"
    SRunning = "SRunning"
    STerminal = "STerminal"

    \* Results
    RNone = "RNone"
    RSuccess = "RSuccess"
    RFailure = "RFailure"
    RCancelled = "RCancelled"
    RSkipped = "RSkipped"

    \* Concurrency holder kinds
    HolderRun = "HolderRun"
    HolderJob = "HolderJob"
    HolderJobSet = "HolderJobSet"

    \* Queue modes
    ModeSingle = "ModeSingle"
    ModeMax = "ModeMax"

    \* Shutdown sources
    NoShutdown = "NoShutdown"
    SigShutdown = "SigShutdown"
    MsgShutdown = "MsgShutdown"
    OverlapShutdown = "OverlapShutdown"

    \* Step kill causes
    NoKill = "NoKill"
    KillCancel = "KillCancel"
    KillTimeout = "KillTimeout"
    KillBoth = "KillBoth"

    \* Tokenizer states
    Normal = "Normal"
    InString = "InString"

VIEW ModelView

CONSTRAINT TimeBoundBase
ModelView == vars

\* NOTE: the base model encodes the buggy paths, so only the invariants that
\* hold on every (buggy) execution are checked here — the always-true
\* structural invariants and the two protocol facts that even the buggy code
\* maintains. The scenario-target invariants are enabled in the MC hunt cfgs.
INVARIANTS
    \* Protocol facts maintained even by the buggy implementation
    ClaimedExactlyOnce
    NoDedupedUnparsedAck

    \* Structural
    SessionActiveConsistent
    BrokerMsgConsistent
    HeldRunsConsistent
    DispatchQueueUnique
    PendingJobsUnique
    DispatchQueueBelongs
    CorrelationConsistent
    DirtyKnownSteps
