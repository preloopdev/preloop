SPECIFICATION MCSpecFair

CONSTANTS
    \* --- base constants ---
    Runner = {r1, r2}
    Session = {s1, s2}
    RunId = {run1, run2}
    JobId = {job1, job2, job3}
    RequestId = {1, 2, 3, 4, 5, 6, 7, 8}
    Key = {g1, g2}
    JobSetId = {js1}
    StepId = {st1, st2}
    Str = {"s1", "s2"}

    NoRun = norun
    NoJob = nojob
    NoRunner = norunner
    NoKey = nokey
    MESSAGE_ID_BASE = 1000000
    MaxLowMsgs = 12
    MaxHighMsgs = 4
    LeaseSeconds = 3
    JobTimeout = 4
    MaxOutputBytes = 1048576
    MaxChunk = 4
    \* MC10: PRELOOP_REQUIRE_JOB_ASSIGNMENTS=1 makes assignment pairing
    \* mandatory — the promote path that skips on_job_enqueued (F-3)
    \* then yields unclaimable jobs.
    RequireAssignments = TRUE

    StQueued = "StQueued"
    StPending = "StPending"
    StInProgress = "StInProgress"
    StSuccess = "StSuccess"
    StFailure = "StFailure"
    StCancelled = "StCancelled"
    StSkipped = "StSkipped"

    SNone = "SNone"
    SQueued = "SQueued"
    SClaimed = "SClaimed"
    SAcquiring = "SAcquiring"
    SRunning = "SRunning"
    STerminal = "STerminal"

    RNone = "RNone"
    RSuccess = "RSuccess"
    RFailure = "RFailure"
    RCancelled = "RCancelled"
    RSkipped = "RSkipped"

    HolderRun = "HolderRun"
    HolderJob = "HolderJob"
    HolderJobSet = "HolderJobSet"

    ModeSingle = "ModeSingle"
    ModeMax = "ModeMax"

    NoShutdown = "NoShutdown"
    SigShutdown = "SigShutdown"
    MsgShutdown = "MsgShutdown"
    OverlapShutdown = "OverlapShutdown"

    NoKill = "NoKill"
    KillCancel = "KillCancel"
    KillTimeout = "KillTimeout"
    KillBoth = "KillBoth"

    Normal = "Normal"
    InString = "InString"

    \* --- MC bounds: one submission, one arrival, no time/faults ---
    MaxSubmitLimit = 1
    MaxArriveLimit = 1
    MaxCancelLimit = 0
    MaxTimeLimit = 0
    MaxHttpFailLimit = 0
    MaxShutdownLimit = 0
    MaxWorkerCrashLimit = 0
    MaxParseFailLimit = 0
    MaxPostFailLimit = 0
    MaxEscapeSwitchLimit = 0
    MaxMaskFailLimit = 0
    MaxOutputLimit = 0
    MaxInputLimit = 0
    MaxCrashLimit = 0
    MaxCancelQueue = 4
    MaxDispatchQueue = 4
    MaxPendingJobs = 4

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT TimeBound
CONSTRAINT QueueConstraint

INVARIANTS
    \* --- Scenario 3 targets ---
    FanoutCorrelationRegistered
    NoLeakedRequest
    GateBeforeDispatch
    CancelledJobNeverDispatched

    \* --- Structural ---
    CorrelationConsistent
    DispatchQueueUnique
    PendingJobsUnique

PROPERTIES
    JobEventuallyClaimed
