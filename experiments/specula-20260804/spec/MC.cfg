SPECIFICATION MCSpec

CONSTANTS
    \* --- base constants ---
    Runner = {r1, r2}
    Session = {s1, s2}
    RunId = {run1, run2}
    JobId = {job1, job2, job3}
    RequestId = {1, 2, 3, 4, 5, 6, 7, 8}
    Key = {g1, g2}
    JobSetId = {js1}
    StepId = {st1, st2}
    Str = {"s1", "s2"}

    NoRun = norun
    NoJob = nojob
    NoRunner = norunner
    NoKey = nokey
    MESSAGE_ID_BASE = 1000000
    MaxLowMsgs = 12
    MaxHighMsgs = 4
    LeaseSeconds = 3
    JobTimeout = 4
    MaxOutputBytes = 1048576
    MaxChunk = 4
    RequireAssignments = FALSE

    StQueued = "StQueued"
    StPending = "StPending"
    StInProgress = "StInProgress"
    StSuccess = "StSuccess"
    StFailure = "StFailure"
    StCancelled = "StCancelled"
    StSkipped = "StSkipped"

    SNone = "SNone"
    SQueued = "SQueued"
    SClaimed = "SClaimed"
    SAcquiring = "SAcquiring"
    SRunning = "SRunning"
    STerminal = "STerminal"

    RNone = "RNone"
    RSuccess = "RSuccess"
    RFailure = "RFailure"
    RCancelled = "RCancelled"
    RSkipped = "RSkipped"

    HolderRun = "HolderRun"
    HolderJob = "HolderJob"
    HolderJobSet = "HolderJobSet"

    ModeSingle = "ModeSingle"
    ModeMax = "ModeMax"

    NoShutdown = "NoShutdown"
    SigShutdown = "SigShutdown"
    MsgShutdown = "MsgShutdown"
    OverlapShutdown = "OverlapShutdown"

    NoKill = "NoKill"
    KillCancel = "KillCancel"
    KillTimeout = "KillTimeout"
    KillBoth = "KillBoth"

    Normal = "Normal"
    InString = "InString"

    \* --- MC bounds ---
    MaxSubmitLimit = 2
    MaxArriveLimit = 3
    MaxCancelLimit = 2
    MaxTimeLimit = 8
    MaxHttpFailLimit = 1
    MaxShutdownLimit = 1
    MaxWorkerCrashLimit = 1
    MaxParseFailLimit = 1
    MaxPostFailLimit = 1
    MaxEscapeSwitchLimit = 1
    MaxMaskFailLimit = 1
    MaxOutputLimit = 2
    MaxInputLimit = 3
    MaxCrashLimit = 1
    MaxCancelQueue = 6
    MaxDispatchQueue = 6
    MaxPendingJobs = 6

SYMMETRY Symmetry
VIEW ModelView
CONSTRAINT TimeBound
CONSTRAINT QueueConstraint

INVARIANTS
    \* --- Protocol facts maintained even by the buggy implementation ---
    ClaimedExactlyOnce
    NoDedupedUnparsedAck

    \* --- Structural ---
    SessionActiveConsistent
    BrokerMsgConsistent
    HeldRunsConsistent
    DispatchQueueUnique
    PendingJobsUnique
    DispatchQueueBelongs
    CorrelationConsistent
    DirtyKnownSteps
    DeliveredCancelAuditConsistent
    FaultCountersBounded

    \* --- Scenario-target invariants (enabled only in MC_hunt_<scenario>.cfg) ---
    \* CancelDeliveredToOwner        (S1 F1/F2)
    \* NoGhostExecution              (S1 S1)
    \* OutcomeIsRunnerReported       (S1 S2)
    \* CancelledJobNeverDispatched   (S2 F1)
    \* GateBeforeDispatch            (S2 F8, S3 F-2)
    \* TerminalRunReleasesKeys       (S2 F2)
    \* NoTerminalRunHoldsSlot        (S2 F2)
    \* FanoutCorrelationRegistered   (S3 guard)
    \* NoLeakedRequest               (S3 F-4)
    \* NoStepGroupSurvivesKill       (S4 F-2)
    \* WorkerTerminalOnReport        (S4 F-15)
    \* StepTransitionDelivered       (S5 F1)
    \* TimeoutMeansFailure           (S5 MC18)
    \* OutputSizeBounded             (S5 F4)
    \* ChangeOrderConsistent         (S5 F1 desync)
    \* MaskNeverLeaks                (S6 guard)
    \* FormatEscapeClosed            (S6 F1)

\* --- Temporal properties (enabled only in MC_hunt_<scenario>.cfg with
\*    SPECIFICATION MCSpecFair) ---
\* PendingHolderEventuallyPromoted   (S2 F3)
\* CancelImpliesKill                 (S4 F-1/F-2)
\* NoSilentJobDrop                   (S4 F-5/F-15, S5 F3)
\* CancelClosureForChildren          (S5 F2)
\* EventualJobTermination            (S1 F5)
\* JobEventuallyClaimed              (S3 F-3)
