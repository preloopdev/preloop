description = "Reconstructed v2.337.0 workflow from the gh-official acquirejob capture for 225-docker-build-run."
duration_seconds_max = 300

[[steps]]
kind = "submit_workflow"
path = "225-docker-build-run.yml"

[[steps]]
kind = "wait_for_event"
event = "job_assigned"
timeout = 240

[[steps]]
kind = "wait_for_event"
event = "job_completed"
timeout = 240
