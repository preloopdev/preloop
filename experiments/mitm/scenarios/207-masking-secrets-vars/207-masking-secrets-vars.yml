name: 207-masking-secrets-vars
on: workflow_dispatch

env:
  PLAIN_VAR: "${{ vars.EDGE_VAR || 'fallback-var' }}"

jobs:
  mask:
    runs-on: self-hosted
    env:
      HUNTER2: "${{ secrets.EDGE_TOP_SECRET }}"
    steps:
      - name: "leak-check"
        run: |
          ::add-mask::custom-token-abc123
          echo "secret value is $HUNTER2 and var is $PLAIN_VAR"
          echo "also masking custom-token-abc123 inline"
          echo "::add-mask::inline-mask-xyz"
          echo "printing inline-mask-xyz which should be starred"
      - name: "workflow-commands"
        run: |
          echo "::warning::this is a warning"
          echo "::error file=edge.rs,line=42,endLine=44,title=Edge Error::error message"
          echo "::notice::a notice"
          echo "::debug::debug trace"
          echo "::group::my group"
          echo "inside group"
          echo "::endgroup::"
