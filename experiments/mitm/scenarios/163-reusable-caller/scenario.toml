description = "Local reusable workflow execution with input type validation and output mapping"
duration_seconds_max = 300

[[steps]]
kind = "submit_workflow"
path = "163-reusable-caller.yml"

[[steps]]
kind = "wait_for_event"
event = "job_assigned"
timeout = 120

[[steps]]
kind = "wait_for_event"
event = "job_completed"
timeout = 240
