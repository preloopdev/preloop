description = "Submit a workflow that emits warning and error workflow commands before failing."
duration_seconds_max = 300

[[steps]]
kind = "submit_workflow"
path = "14-annotations.yml"

[[steps]]
kind = "wait_for_event"
event = "job_assigned"
timeout = 120

[[steps]]
kind = "wait_for_event"
event = "job_completed"
timeout = 240
