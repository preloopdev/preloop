name: 102-mask-and-secret-propagation
on: workflow_dispatch
jobs:
  masking-test:
    runs-on: self-hosted
    steps:
      - name: Register dynamic mask and environment variables
        run: |
          DYNAMIC_TOKEN="super-secret-token-12345"
          echo "::add-mask::$DYNAMIC_TOKEN"
          echo "MY_SECRET=$DYNAMIC_TOKEN" >> $GITHUB_ENV
          echo "output_secret=$DYNAMIC_TOKEN" >> $GITHUB_OUTPUT
          echo "MULTILINE_ENV<<EOF" >> $GITHUB_ENV
          echo "line1=$DYNAMIC_TOKEN" >> $GITHUB_ENV
          echo "line2" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Verify log redaction
        run: |
          echo "Environment secret is: $MY_SECRET"
          echo "Raw secret text: super-secret-token-12345"
