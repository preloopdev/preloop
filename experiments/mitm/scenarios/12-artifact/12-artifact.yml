name: mitm artifact
on: workflow_dispatch
jobs:
  build:
    runs-on: [self-hosted, mitm]
    steps:
      - run: echo hi > out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out.txt
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: dl
      - run: cat dl/out.txt
