description = "Reconstructed v2.337.0 workflow from the gh-official acquirejob capture for 218-node-migration."
duration_seconds_max = 300

[[steps]]
kind = "submit_workflow"
path = "218-node-migration.yml"

[[steps]]
kind = "wait_for_event"
event = "job_assigned"
timeout = 240

[[steps]]
kind = "wait_for_event"
event = "job_completed"
timeout = 240
