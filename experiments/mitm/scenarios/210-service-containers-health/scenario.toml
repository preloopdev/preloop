description = "Reconstructed v2.337.0 workflow from the gh-official acquirejob capture for 210-service-containers-health."
duration_seconds_max = 300

[[steps]]
kind = "submit_workflow"
path = "210-service-containers-health.yml"

[[steps]]
kind = "wait_for_event"
event = "job_assigned"
timeout = 240

[[steps]]
kind = "wait_for_event"
event = "job_completed"
timeout = 240
