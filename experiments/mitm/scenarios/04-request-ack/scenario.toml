description = "Runner registers, idles, receives a job, and acknowledges it."
duration_seconds_max = 300

[[steps]]
kind = "submit_workflow"
path = "workflow.yml"

[[steps]]
kind = "wait_for_event"
event = "job_assigned"
timeout = 120

[[steps]]
kind = "wait_for_event"
event = "job_completed"
timeout = 180
