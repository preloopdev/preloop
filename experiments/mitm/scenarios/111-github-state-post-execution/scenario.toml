description = "State persistence via GITHUB_STATE across post-step execution boundaries"
duration_seconds_max = 300

[[steps]]
kind = "submit_workflow"
path = "111-github-state-post-execution.yml"

[[steps]]
kind = "wait_for_event"
event = "job_assigned"
timeout = 120

[[steps]]
kind = "wait_for_event"
event = "job_completed"
timeout = 240
