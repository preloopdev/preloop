description = "Submit a workflow with multiple run steps, env expansion, and multiline shell output."
duration_seconds_max = 300

[[steps]]
kind = "submit_workflow"
path = "06-multi-step.yml"

[[steps]]
kind = "wait_for_event"
event = "job_assigned"
timeout = 120

[[steps]]
kind = "wait_for_event"
event = "job_completed"
timeout = 240
