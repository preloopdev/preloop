name: p0-failure-conditions
on: push
jobs:
  failure-and-always:
    runs-on: self-hosted
    steps:
      # 1. This step fails intentionally
      - name: Intentional failure
        id: failing
        run: |
          echo "About to fail"
          exit 1

      # 2. success() — should be SKIPPED after failure
      - name: Should be skipped (success)
        if: success()
        run: |
          echo "BUG: this should not have run"
          exit 1

      # 3. failure() — should RUN after failure
      - name: Runs on failure
        if: failure()
        run: echo "failure-condition-ran"

      # 4. always() — should RUN regardless
      - name: Runs always
        if: always()
        run: echo "always-condition-ran"

      # 5. Another always step to prove chaining
      - name: Always final marker
        if: always()
        run: echo "ALL_P0_FAILURE_CONDITION_CHECKS_PASSED"
