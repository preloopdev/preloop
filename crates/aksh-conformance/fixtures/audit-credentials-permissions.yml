name: Audit RLIS-06 credential file permissions
on:
  workflow_dispatch:
  push:
jobs:
  cred-perms:
    runs-on: [self-hosted, p1-test]
    steps:
      # Credential files (.runner, .credentials, .credentials_rsaparams) live in the
      # runner root, two levels above RUNNER_TEMP (_work/_temp).
      # RLIS-06: fix ensures these are written 0600 on Unix.
      - name: Check credential file permissions
        run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          # Runner root is two levels up: _work/_temp -> _work -> runner-root
          RUNNER_ROOT=$(dirname "$(dirname "$RUNNER_TEMP")")
          echo "RUNNER_ROOT=$RUNNER_ROOT"

          # On macOS stat uses -f%OLp; on Linux stat uses -c%a
          if stat --version > /dev/null 2>&1; then
            STAT_FMT="-c%a"
          else
            STAT_FMT="-f%OLp"
          fi

          any_found=0
          for f in .runner .credentials .credentials_rsaparams; do
            path="$RUNNER_ROOT/$f"
            if [ ! -f "$path" ]; then
              echo "SKIP: $f not found at $path"
              continue
            fi
            any_found=1
            perms=$(stat $STAT_FMT "$path")
            echo "$f permissions: $perms"
            if [ "$perms" = "600" ]; then
              echo "PASS: $f is 0600"
            else
              echo "FAIL: $f is $perms (expected 600)"
              exit 1
            fi
          done

          if [ "$any_found" = "0" ]; then
            echo "FAIL: no credential files found under $RUNNER_ROOT"
            ls -la "$RUNNER_ROOT" || true
            exit 1
          fi

      - name: RLIS-06 credential permissions PASS
        run: echo "ALL_CREDENTIAL_PERMISSION_CHECKS_PASSED"
