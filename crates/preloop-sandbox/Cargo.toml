[package]
name = "preloop-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Preloop Sandbox Service: templates, pools, leases and host agents over pluggable VM backends"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
buffa.workspace = true
connectrpc.workspace = true
bytes.workspace = true
futures.workspace = true
hex.workspace = true
hostname.workspace = true
hyper-util.workspace = true
nix = { version = "0.31", features = ["signal"] }
opentelemetry.workspace = true
parking_lot.workspace = true
postgres_rustls.workspace = true
preloop-observability = { path = "../preloop-observability" }
rand.workspace = true
rcgen = { workspace = true, features = ["x509-parser"] }
# Sealed envelopes for the few secrets that must survive a retry (lease and
# exec env). `ring` is already in the workspace lock at 0.17.14 through rustls;
# this is a first-party manifest edge on that identical locked version.
ring = "0.17"
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
time = "0.3"
tokio = { workspace = true, features = ["process"] }
tokio-postgres.workspace = true
tokio-rustls.workspace = true
tokio-util = { workspace = true, features = ["io"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
opentelemetry_sdk.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "net"] }
tower = { workspace = true, features = ["util"] }
x509-parser = "0.18"
