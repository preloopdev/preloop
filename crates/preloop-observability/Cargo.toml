[package]
name = "preloop-observability"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Observability handle for Preloop — metrics, logs, traces, status snapshot"
repository = "https://github.com/preloopdev/preloop"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
webpki-root-certs = { workspace = true }
tokio = { workspace = true }

# SIGKILL one process group at a deadline. `nix` is the safe wrapper around
# `kill(2)`: the workspace forbids `unsafe`, which rules out raw `libc` calls.
# Already in the tree via command-group. Unix-only — non-Unix builds take the
# `cfg(not(unix))` path, which never signals a group.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

[dev-dependencies]
rcgen.workspace = true

[lints]
workspace = true
