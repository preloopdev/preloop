[package]
name = "preloop-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Preloop CI command-line interface"

[package.metadata.dist]
dist = true
# The crate is `preloop-cli` and the binary `preloop`; dist derives the
# Homebrew formula and npm package from the package name, so both are pinned
# to the names users actually type:
#   brew install preloopdev/tap/preloop
#   npm install -g @preloop-dev/cli
formula = "preloop"
npm-scope = "@preloop-dev"
npm-package = "cli"

[[bin]]
name = "preloop"
path = "src/main.rs"

[dependencies]
preloop-observability = { path = "../preloop-observability" }
preloop-orchestrator = { path = "../preloop-orchestrator" }
preloop-vm = { path = "../preloop-vm" }
preloop-runner-server = { path = "../preloop-runner-server" }
preloop-gha-parser = { path = "../preloop-gha-parser" }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
futures-util = "0.3"
tokio-tungstenite = { workspace = true }
libc = "0.2"
preloop-gha-protocol = { path = "../preloop-gha-protocol" }
self-replace = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
rsa = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }

serde_yaml = { workspace = true }
rpassword = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }
