[package]
name = "preloop-cli"
version = "0.31.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Preloop CI command-line interface"

[package.metadata.dist]
dist = true

[[bin]]
name = "preloop"
path = "src/main.rs"

[dependencies]
preloop-observability = { path = "../preloop-observability" }
preloop-orchestrator = { path = "../preloop-orchestrator" }
preloop-vm = { path = "../preloop-vm" }
preloop-runner-server = { path = "../preloop-runner-server" }
preloop-gha-parser = { path = "../preloop-gha-parser" }
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
reqwest = { workspace = true }
rand = { workspace = true }
futures-util = "0.3"
tokio-tungstenite = { workspace = true }
libc = "0.2"
preloop-gha-protocol = { path = "../preloop-gha-protocol" }
self-replace = { workspace = true }
semver = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
zip = { workspace = true }
tempfile = { workspace = true }

serde_yaml = { workspace = true }
rpassword = { workspace = true }
[dev-dependencies]
tempfile = { workspace = true }
