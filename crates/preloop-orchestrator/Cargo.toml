[package]
name = "preloop-orchestrator"
version = "0.21.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Job scheduling and VM lifecycle orchestration for Preloop CI"

[dependencies]
preloop-vm = { path = "../preloop-vm" }
preloop-gha-protocol = { path = "../preloop-gha-protocol" }
preloop-observability = { path = "../preloop-observability" }
preloop-runner-server = { path = "../preloop-runner-server" }
preloop-gha-parser = { path = "../preloop-gha-parser" }
anyhow = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = "0.10"
hex = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }

# Free space for the golden download. `nix` is the safe wrapper around
# `statvfs`: the workspace forbids `unsafe`, which rules out raw `libc`
# calls. Already in the tree via command-group. Unix-only — non-Unix builds
# report the error and the caller continues without the space check.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util", "net"] }
