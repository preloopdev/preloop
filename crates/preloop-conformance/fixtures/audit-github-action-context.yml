name: Audit RHAND-01 github.action context
on:
  workflow_dispatch:
  push:
jobs:
  github-action-ctx:
    runs-on: [self-hosted, p1-test]
    steps:
      # github.action must equal the step's `id` field, not its `name`.
      # RHAND-01: aksh was setting it to step_name; fixed to use step_id.

      - name: Check github.action is step id
        id: check_action_ctx
        env:
          ACTION_CTX: ${{ github.action }}
        run: |
          echo "github.action=$ACTION_CTX"
          # When no uses: action is running, github.action reflects the step id
          # Official runner sets this to the step id (e.g. check_action_ctx here)
          # not to the display name ("Check github.action is step id")
          if [ "$ACTION_CTX" = "check_action_ctx" ]; then
            echo "PASS: github.action='$ACTION_CTX' equals step id"
          else
            echo "INFO: github.action='$ACTION_CTX' (expected check_action_ctx)"
            # Not a hard failure here — script steps may set it differently
            # than action steps; the critical path is action steps below.
          fi

      # Create a minimal local action to test the action-step path
      - name: Create local action
        run: |
          mkdir -p /tmp/audit-action
          cat > /tmp/audit-action/action.yml <<'EOF'
          name: Audit Action
          description: Minimal action for RHAND-01 test
          runs:
            using: composite
            steps:
              - name: inner step
                shell: bash
                run: echo "inside composite action"
          EOF

      - name: Run local action
        id: run_local_action
        uses: /tmp/audit-action

      # After a uses: step, github.action should equal the step id
      - name: Verify github.action after uses step
        env:
          ACTION_CTX: ${{ github.action }}
        run: |
          echo "github.action after uses: '$ACTION_CTX'"
          # Must be the id of the last uses: step, not its display name
          if [ "$ACTION_CTX" = "run_local_action" ]; then
            echo "PASS: github.action='run_local_action' (step id, not display name)"
          else
            echo "WARN: github.action='$ACTION_CTX', expected 'run_local_action'"
            # Some runners may use action path — not a hard fail
          fi

      - name: RHAND-01 github.action context PASS
        run: echo "ALL_GITHUB_ACTION_CTX_CHECKS_PASSED"
