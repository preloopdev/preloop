name: Audit RCON-01 docker exec -i flag
on:
  workflow_dispatch:
  push:
jobs:
  container-exec:
    runs-on: [self-hosted, p0-linux]
    container:
      image: alpine:3.20
    steps:
      # RCON-01: docker exec was missing -i flag; stdin-reading commands would hang.
      # With -i, the container keeps stdin open and commands that read from stdin
      # can proceed (they see EOF immediately since we don't pipe anything).

      # 1. Basic exec works (regression guard)
      - name: Basic command in container
        run: echo "container exec works"

      # 2. Stdin is attached (not null): a command that reads from stdin
      #    should get EOF immediately rather than hanging indefinitely
      - name: Stdin is open (reads EOF cleanly)
        run: |
          # With -i, read from stdin returns immediately with empty result
          # Without -i, this may hang or fail
          result=$(head -0 /dev/stdin 2>/dev/null || true)
          echo "stdin read result: '$result'"
          echo "PASS: stdin read did not hang"

      # 3. Pipeline reading from stdin works
      - name: Pipeline with stdin
        run: |
          echo "piped data" | cat
          echo "PASS: stdin pipeline works"

      # 4. Environment is visible inside exec
      - name: Env visible in exec
        env:
          EXEC_TEST_VAR: exec-test-value
        run: |
          echo "EXEC_TEST_VAR=$EXEC_TEST_VAR"
          test "$EXEC_TEST_VAR" = "exec-test-value"
          echo "PASS: env visible in exec"

      - name: RCON-01 docker exec -i PASS
        run: echo "ALL_CONTAINER_EXEC_CHECKS_PASSED"
