[package]
name = "preloop-vm"
version = "0.21.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "VM provider abstraction for Preloop CI"

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
preloop-gha-protocol = { path = "../preloop-gha-protocol" }
preloop-observability = { path = "../preloop-observability" }
hex = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
uuid = { workspace = true }

# Declared although the env-guard test helpers that used it are gone: dropping
# a dependency rewrites `Cargo.lock`, and the supply-chain isolation rule keeps
# lockfile changes in their own PR (AGENTS.md, "Supply-chain policy
# isolation"). The removal ships separately — see the
# `deps/drop-unused-libc-and-parking-lot` follow-up.
[dev-dependencies]
parking_lot.workspace = true
