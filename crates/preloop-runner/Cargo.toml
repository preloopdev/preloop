[package]
name = "preloop-runner"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust reimplementation of the GitHub Actions runner (Runner.Listener + Runner.Worker)"

[[bin]]
name = "preloop-runner"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
preloop-observability = { path = "../preloop-observability" }
preloop-gha-protocol = { path = "../preloop-gha-protocol" }
preloop-gha-expressions = { path = "../preloop-gha-expressions" }
preloop-gha-parser = { path = "../preloop-gha-parser" }
preloop-dap = { path = "../preloop-dap" }

cap-std = { workspace = true }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
chrono.workspace = true
flate2.workspace = true
indexmap.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tempfile.workspace = true
parking_lot = { workspace = true }
thiserror.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
command-group.workspace = true
glob.workspace = true
hostname.workspace = true
bytes.workspace = true
serde_yaml.workspace = true
hex.workspace = true
regex.workspace = true
zip.workspace = true

# Cancellation signals the process group by id, because the child handle stops
# addressing the group once the leader is reaped. `nix` is the safe wrapper:
# the workspace forbids `unsafe`, which rules out raw `libc` calls. Already in
# the tree via command-group. Unix-only — `nix` does not build on Windows,
# where the `cfg(not(unix))` paths in `process.rs` apply instead.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal", "process"] }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
# Real HTTP round-trips for the debug-session client: a hand-rolled fake would
# not exercise serde, status handling, or the long-poll timeout path.
axum.workspace = true
