name: E2E ripgrep
on: workflow_dispatch

jobs:
  build_and_test:
    name: Build and Test Ripgrep
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BurntSushi/ripgrep
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
