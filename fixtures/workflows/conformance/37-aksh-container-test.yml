name: "aksh: container-test"
on: workflow_dispatch

jobs:
  container-basic:
    runs-on: [self-hosted, aksh-container]
    container: node:20-bookworm-slim
    steps:
      - name: Node version
        run: node --version
      - name: Verify container
        run: |
          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          echo "Running inside container"
