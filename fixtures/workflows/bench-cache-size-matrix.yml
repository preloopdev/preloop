          fi

  restore-large:
    runs-on: self-hosted
    needs: save-large
    steps:
      - name: restore 25MB cache and measure
        run: |
          CACHE_URL="${ACTIONS_CACHE_SERVICE_URL:-http://127.0.0.1:9090}"
          TOKEN="${GITHUB_TOKEN:-}"
          KEY="bench-size-large-${GITHUB_RUN_ID:-$$}"
