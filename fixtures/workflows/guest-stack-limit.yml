name: Guest stack limit
on: push

# GitHub's hosted ubuntu images double the kernel's 8192 KiB process stack
# (`actions/runner-images` `configure-limits.sh` writes
# `DefaultLimitSTACK=16M:infinity`), and a hosted container inherits that pair
# from the `dockerd` service. A preloop guest boots straight into the job
# workload, so nothing applies those files: the runner wrapper, the
# container-engine launch, and the golden's preload daemon raise the stack
# themselves. This is the guest-level check for those paths.
#
#   preloop run -f fixtures/workflows/guest-stack-limit.yml
#
# On a guest that kept the kernel default the limit assertions fail, and the
# deep-recursion probe — pydantic's crashing optimizer shape, `bad_recursive`:
# more than 8192 KiB of frames, well inside 16384 KiB — dies with SIGSEGV
# instead of returning. The probe runs both on the runner and inside a
# container, because a container's processes inherit the engine's limits
# rather than the runner's. `ubuntu:24.04` is pulled at job time unless the
# workspace declares it (then the engine preloads it into the golden).

jobs:
  runner-and-container:
    runs-on: ubuntu-latest
    steps:
      - name: the runner chain runs on the hosted stack
        run: |
          soft=$(ulimit -s)
          hard=$(ulimit -Hs)
          echo "runner stack: soft=${soft}KiB hard=${hard}"
          [ "$soft" = "16384" ] || { echo "expected the hosted 16384 KiB soft stack"; exit 1; }
          [ "$hard" = "unlimited" ] || { echo "expected an unlimited hard stack"; exit 1; }
      - name: deep recursion survives what pydantic's tests walk
        run: |
          cat >/tmp/recurse.c <<'EOF'
          #include <stdio.h>

          static volatile int sink;

          /* -O0 keeps every frame real: ~2 KiB of pad per call, 5000 calls
           * is ~10 MiB — past 8192 KiB, comfortably inside 16384 KiB. */
          static int descend(int depth) {
            char pad[2048];
            pad[0] = (char)depth;
            if (depth <= 0)
              return pad[0];
            return descend(depth - 1) + pad[0];
          }

          int main(void) {
            sink = descend(5000);
            printf("deep recursion survived: %d\n", sink);
            return 0;
          }
          EOF
          gcc -O0 -o /tmp/recurse /tmp/recurse.c
          /tmp/recurse
      - name: a container run inherits the engine's stack
        run: |
          docker run --rm -v /tmp:/probe ubuntu:24.04 sh -c '
            soft=$(ulimit -s)
            hard=$(ulimit -Hs)
            echo "container stack: soft=${soft}KiB hard=${hard}"
            [ "$soft" = "16384" ] || { echo "expected the hosted 16384 KiB soft stack"; exit 1; }
            [ "$hard" = "unlimited" ] || { echo "expected an unlimited hard stack"; exit 1; }
            /probe/recurse
          '

  container-job:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: a container job inherits the engine's stack
        run: |
          soft=$(ulimit -s)
          hard=$(ulimit -Hs)
          echo "container job stack: soft=${soft}KiB hard=${hard}"
          [ "$soft" = "16384" ] || { echo "expected the hosted 16384 KiB soft stack"; exit 1; }
          [ "$hard" = "unlimited" ] || { echo "expected an unlimited hard stack"; exit 1; }
