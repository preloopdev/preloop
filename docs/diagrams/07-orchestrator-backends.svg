<text x="480" y="53.0" font-size="28" font-family="system-ui, sans-serif" fill="#1e1e1e" font-weight="500">preloop-orchestrator — Pluggable Backends</text>
<text x="380" y="75.0" font-size="15" font-family="system-ui, sans-serif" fill="#757575" font-weight="400">Three core Rust traits decouple state storage, authentication, and runner execution</text>
<rect x="50" y="110" width="430" height="940" rx="10" fill="#dbe4ff" fill-opacity="0.25" stroke="#1e40af" stroke-width="1.5"/>
<text x="70" y="143.0" font-size="18" font-family="system-ui, sans-serif" fill="#1e40af" font-weight="500">RunStore implementations</text>
<rect x="70" y="165" width="390" height="90" rx="10" fill="#d0bfff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="265" y="205.3" text-anchor="middle" font-size="17" font-family="system-ui, sans-serif" fill="#7c3aed" font-weight="600">trait RunStore</text>
<text x="265" y="226.6" text-anchor="middle" font-size="17" font-family="system-ui, sans-serif" fill="#7c3aed" font-weight="600">persist RunId, JobId, status &amp; queue state</text>
<rect x="70" y="290" width="390" height="75" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="265" y="323.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#4a9eed" font-weight="600">InMemory (local dev / tests)</text>
<text x="265" y="342.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#4a9eed" font-weight="600">Arc&lt;Mutex&lt;HashMap&gt;&gt;, no disk persistence</text>
<rect x="70" y="405" width="390" height="75" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="265" y="438.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#4a9eed" font-weight="600">File (current default)</text>
<text x="265" y="457.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#4a9eed" font-weight="600">.preloop/ disk cache &amp; artifact files</text>
<rect x="70" y="520" width="390" height="75" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="265" y="553.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#4a9eed" font-weight="600">Sqlx (production cluster)</text>
<text x="265" y="572.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#4a9eed" font-weight="600">PostgreSQL / SQLite via repo trait</text>
<rect x="70" y="635" width="390" height="75" rx="10" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/>
<text x="265" y="668.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#4a9eed" font-weight="600">None (stateless proxy)</text>
<text x="265" y="687.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#4a9eed" font-weight="600">fire-and-forget, BYO external runner</text>
<rect x="520" y="110" width="430" height="940" rx="10" fill="#fff3bf" fill-opacity="0.25" stroke="#f59e0b" stroke-width="1.5"/>
<text x="540" y="143.0" font-size="18" font-family="system-ui, sans-serif" fill="#f59e0b" font-weight="500">AuthProvider implementations</text>
<rect x="540" y="165" width="390" height="90" rx="10" fill="#d0bfff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="735" y="205.3" text-anchor="middle" font-size="17" font-family="system-ui, sans-serif" fill="#7c3aed" font-weight="600">trait AuthProvider</text>
<text x="735" y="226.6" text-anchor="middle" font-size="17" font-family="system-ui, sans-serif" fill="#7c3aed" font-weight="600">inbound verification &amp; OIDC token minting</text>
<rect x="540" y="290" width="390" height="75" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
<text x="735" y="323.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#f59e0b" font-weight="600">LoopbackTrust (local single-user)</text>
<text x="735" y="342.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#f59e0b" font-weight="600">127.0.0.1 trusted as admin</text>
<rect x="540" y="405" width="390" height="75" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
<text x="735" y="438.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#f59e0b" font-weight="600">Preloop Token (bearer CLI)</text>
<text x="735" y="457.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#f59e0b" font-weight="600">issued bearer tokens for CLI agents</text>
<rect x="540" y="520" width="390" height="75" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
<text x="735" y="553.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#f59e0b" font-weight="600">OAuth + mTLS (server / runner)</text>
<text x="735" y="572.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#f59e0b" font-weight="600">GitHub App JWT &amp; mTLS polling</text>
<rect x="540" y="635" width="390" height="75" rx="10" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2"/>
<text x="735" y="668.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#f59e0b" font-weight="600">OIDC Federation (cloud WIF)</text>
<text x="735" y="687.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#f59e0b" font-weight="600">OIDC workload identity tokens</text>
<rect x="990" y="110" width="460" height="940" rx="10" fill="#eebefa" fill-opacity="0.2" stroke="#a21caf" stroke-width="1.5"/>
<text x="1010" y="143.0" font-size="18" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="500">RunnerProvider implementations</text>
<rect x="1010" y="165" width="420" height="90" rx="10" fill="#d0bfff" stroke="#7c3aed" stroke-width="2.5"/>
<text x="1220" y="205.3" text-anchor="middle" font-size="17" font-family="system-ui, sans-serif" fill="#7c3aed" font-weight="600">trait RunnerProvider</text>
<text x="1220" y="226.6" text-anchor="middle" font-size="17" font-family="system-ui, sans-serif" fill="#7c3aed" font-weight="600">ephemeral runner lifecycle &amp; log streams</text>
<rect x="1010" y="290" width="420" height="75" rx="10" fill="#eebefa" stroke="#a21caf" stroke-width="2"/>
<text x="1220" y="323.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">Process (subprocess runner)</text>
<text x="1220" y="342.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">spawn preloop-runner run child process</text>
<rect x="1010" y="405" width="420" height="75" rx="10" fill="#eebefa" stroke="#a21caf" stroke-width="2"/>
<text x="1220" y="438.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">Container (docker engine)</text>
<text x="1220" y="457.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">per-job container with mounted workspace</text>
<rect x="1010" y="520" width="420" height="75" rx="10" fill="#eebefa" stroke="#a21caf" stroke-width="2"/>
<text x="1220" y="553.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">preloop-vm (smolvm / libkrun)</text>
<text x="1220" y="572.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">ephemeral microVM with packed kernel</text>
<rect x="1010" y="635" width="420" height="75" rx="10" fill="#eebefa" stroke="#a21caf" stroke-width="2"/>
<text x="1220" y="668.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">Kubernetes (k8s pod)</text>
<text x="1220" y="687.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">kube-rs ephemeral runner pod</text>
<rect x="1010" y="750" width="420" height="75" rx="10" fill="#eebefa" stroke="#a21caf" stroke-width="2"/>
<text x="1220" y="783.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">Cloud VM (EC2 / GCE)</text>
<text x="1220" y="802.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">provision cloud VM instance per job</text>
<rect x="1010" y="865" width="420" height="75" rx="10" fill="#eebefa" stroke="#a21caf" stroke-width="2"/>
<text x="1220" y="898.4" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">BYO External Runner</text>
<text x="1220" y="917.1" text-anchor="middle" font-size="15" font-family="system-ui, sans-serif" fill="#a21caf" font-weight="600">external runner registers &amp; polls directly</text>
