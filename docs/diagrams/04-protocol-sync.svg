<svg xmlns="http://www.w3.org/2000/svg" width="2140" height="800" viewBox="10 -30 2140 800" style="background-color: #ffffff;"><defs><marker id="arrow-6d28d9" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9" /></marker><marker id="arrow-b45309" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309" /></marker><marker id="arrow-047857" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" /></marker><marker id="arrow-c2410c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" /></marker></defs><text font-family="system-ui, sans-serif" font-size="38px" fill="#1e40af" dominant-baseline="hanging" text-anchor="middle" x="1300.0" y="20"><tspan x="1300.0" dy="0em">Automated Protocol Sync</tspan></text><text font-family="system-ui, sans-serif" font-size="16px" fill="#3b82f6" dominant-baseline="hanging" text-anchor="middle" x="1300.0" y="70"><tspan x="1300.0" dy="0em">The runner-watch pipeline: continuous tracking, AI code generation, and golden replay validation</tspan></text><ellipse stroke="#c2410c" stroke-width="2" fill="#fed7aa" cx="150.0" cy="200.0" rx="90.0" ry="40.0" /><text font-family="system-ui, sans-serif" font-size="12px" fill="#7c2d12" dominant-baseline="hanging" text-anchor="middle" x="150.0" y="176.6"><tspan x="150.0" dy="0em">Release Watcher</tspan><tspan x="150.0" dy="1.3em">Polls GitHub releases</tspan><tspan x="150.0" dy="1.3em">ATOM feed</tspan></text><rect stroke="#047857" stroke-width="2" fill="#a7f3d0" x="320" y="160" width="180" height="80" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="12px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="410.0" y="176.6"><tspan x="410.0" dy="0em">Source Differ</tspan><tspan x="410.0" dy="1.3em">Listener/Worker/Common</tspan><tspan x="410.0" dy="1.3em">Finds added DTOs/calls</tspan></text><rect stroke="#047857" stroke-width="2" fill="#a7f3d0" x="580" y="160" width="180" height="80" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="12px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="670.0" y="176.6"><tspan x="670.0" dy="0em">Triage Specs</tspan><tspan x="670.0" dy="1.3em">Emits target TOML specs</tspan><tspan x="670.0" dy="1.3em">for changed surface</tspan></text><rect stroke="#6d28d9" stroke-width="2" fill="#ddd6fe" x="840" y="160" width="180" height="80" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="12px" fill="#5b21b6" dominant-baseline="hanging" text-anchor="middle" x="930.0" y="176.6"><tspan x="930.0" dy="0em">AI Categorizer</tspan><tspan x="930.0" dy="1.3em">Claude triage</tspan><tspan x="930.0" dy="1.3em">(blocker, concern, etc.)</tspan></text><rect stroke="#6d28d9" stroke-width="2" fill="#ddd6fe" x="1100" y="160" width="180" height="80" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="12px" fill="#5b21b6" dominant-baseline="hanging" text-anchor="middle" x="1190.0" y="176.6"><tspan x="1190.0" dy="0em">Code Generator</tspan><tspan x="1190.0" dy="1.3em">Claude implements</tspan><tspan x="1190.0" dy="1.3em">Auto check loop (max 10)</tspan></text><rect stroke="#b45309" stroke-width="2" fill="#fef3c7" x="1360" y="160" width="180" height="80" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="12px" fill="#78350f" dominant-baseline="hanging" text-anchor="middle" x="1450.0" y="176.6"><tspan x="1450.0" dy="0em">Conformance Gate</tspan><tspan x="1450.0" dy="1.3em">MITM Replay against aksh</tspan><tspan x="1450.0" dy="1.3em">Runs compare.rs</tspan></text><ellipse stroke="#047857" stroke-width="2" fill="#a7f3d0" cx="1710.0" cy="200.0" rx="90.0" ry="40.0" /><text font-family="system-ui, sans-serif" font-size="12px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="1710.0" y="176.6"><tspan x="1710.0" dy="0em">Draft PR</tspan><tspan x="1710.0" dy="1.3em">1 PR per runner release</tspan><tspan x="1710.0" dy="1.3em">Auto-merge nit-only</tspan></text><path stroke="#c2410c" stroke-width="2" fill="none" d="M 242 200 L 318 200" marker-end="url(#arrow-c2410c)" /><path stroke="#047857" stroke-width="2" fill="none" d="M 502 200 L 578 200" marker-end="url(#arrow-047857)" /><path stroke="#047857" stroke-width="2" fill="none" d="M 762 200 L 838 200" marker-end="url(#arrow-047857)" /><path stroke="#6d28d9" stroke-width="2" fill="none" d="M 1022 200 L 1098 200" marker-end="url(#arrow-6d28d9)" /><path stroke="#6d28d9" stroke-width="2" fill="none" d="M 1282 200 L 1358 200" marker-end="url(#arrow-6d28d9)" /><path stroke="#b45309" stroke-width="2" fill="none" d="M 1542 200 L 1618 200" marker-end="url(#arrow-b45309)" /><path stroke="#047857" stroke-width="3" fill="none" d="M 1710 242 L 1710 392 L 160 392 L 160 292" marker-end="url(#arrow-047857)" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="1000.0" y="400"><tspan x="1000.0" dy="0em">Next runner release...</tspan></text><path stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="6,6" d="M 60 480 L 1800 480" /><text font-family="system-ui, sans-serif" font-size="15px" fill="#1e40af" dominant-baseline="hanging" text-anchor="start" x="60" y="500"><tspan x="60" dy="0em">Conformance Harness Detail  (Verification Gate)</tspan></text><rect stroke="#047857" stroke-width="2" fill="#a7f3d0" x="60" y="540" width="500" height="180" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="start" x="70" y="579.95"><tspan x="70" dy="0em">1. Golden Capture  (One-time)</tspan><tspan x="70" dy="1.3em">- record.sh intercepts runner using mitmproxy</tspan><tspan x="70" dy="1.3em">- Captures official GHA backend responses</tspan><tspan x="70" dy="1.3em">- Saves flows.jsonl (sequence of request/response objects)</tspan><tspan x="70" dy="1.3em">- Scenarios 06 to 15 represent workflow surface areas</tspan><tspan x="70" dy="1.3em">  (multistep, step failure, needs DAG, matrix expansion,</tspan><tspan x="70" dy="1.3em">   OIDC id-token, artifacts, composite actions, etc.)</tspan></text><rect stroke="#047857" stroke-width="2" fill="#a7f3d0" x="590" y="540" width="500" height="180" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="start" x="600" y="572.8"><tspan x="600" dy="0em">2. Replay &amp; Compare  (Pure Rust)</tspan><tspan x="600" dy="1.3em">- runner-watch loads flows.jsonl for target scenario</tspan><tspan x="600" dy="1.3em">- materialise_replay_state pre-queues mock GHA jobs</tspan><tspan x="600" dy="1.3em">- Replays request flow sequentially to aksh via reqwest</tspan><tspan x="600" dy="1.3em">- rewrite_replay_body maps golden message IDs to aksh IDs</tspan><tspan x="600" dy="1.3em">- compare.rs compares status codes against golden baseline</tspan><tspan x="600" dy="1.3em">- Skips capture artifact flows with null status (None-status)</tspan><tspan x="600" dy="1.3em">- Ignores un-replayable PKI/OAuth &amp; timing message polls</tspan></text><rect stroke="#dc2626" stroke-width="2" fill="#fee2e2" stroke-dasharray="6,6" x="1120" y="540" width="500" height="180" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#991b1b" dominant-baseline="hanging" text-anchor="start" x="1130" y="579.95"><tspan x="1130" dy="0em">3. Replay Caveats  (Honest gaps)</tspan><tspan x="1130" dy="1.3em">- CacheService stubs return cache-miss and fake urls</tspan><tspan x="1130" dy="1.3em">- ArtifactService stubs return fake URLs, empty list</tspan><tspan x="1130" dy="1.3em">- Action resolution / tarball download calls to codeload</tspan><tspan x="1130" dy="1.3em">  and launch are in should_skip_replay_path and skipped</tspan><tspan x="1130" dy="1.3em">- Gate passes when HTTP status codes match baseline</tspan><tspan x="1130" dy="1.3em">- Body content and actual cache/artifact bytes are not verified</tspan></text><rect stroke="#64748b" stroke-width="1" fill="#f8fafc" x="1650" y="540" width="290" height="180" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#374151" dominant-baseline="hanging" text-anchor="middle" x="1795.0" y="548"><tspan x="1795.0" dy="0em">Legend</tspan></text><text font-family="system-ui, sans-serif" font-size="10px" fill="#374151" dominant-baseline="hanging" text-anchor="start" x="1664" y="574"><tspan x="1664" dy="0em">Solid green   = working</tspan><tspan x="1664" dy="1.3em">Dashed red    = stub / mocked</tspan><tspan x="1664" dy="1.3em">Dashed blue   = not implemented</tspan><tspan x="1664" dy="1.3em">Solid purple  = AI pipeline step</tspan><tspan x="1664" dy="1.3em">Solid orange  = trigger event</tspan><tspan x="1664" dy="1.3em">Solid yellow  = decision point</tspan></text></svg>