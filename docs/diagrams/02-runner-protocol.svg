<svg xmlns="http://www.w3.org/2000/svg" width="1626" height="1580" viewBox="224 -30 1626 1580" style="background-color: #ffffff;"><defs /><text font-family="system-ui, sans-serif" font-size="38px" fill="#1e40af" dominant-baseline="hanging" text-anchor="middle" x="1100.0" y="20"><tspan x="1100.0" dy="0em">Runner Protocol Flow</tspan></text><text font-family="system-ui, sans-serif" font-size="16px" fill="#3b82f6" dominant-baseline="hanging" text-anchor="middle" x="1100.0" y="70"><tspan x="1100.0" dy="0em">Vertical timeline of HTTP calls and lifecycle phases between actions/runner and aksh</tspan></text><path stroke="#1e3a5f" stroke-width="3" fill="none" d="M 280 140 L 280 1500" /><ellipse stroke="#1e3a5f" stroke-width="1" fill="#3b82f6" cx="281.0" cy="187.0" rx="7.0" ry="7.0" /><text font-family="system-ui, sans-serif" font-size="15px" fill="#1e40af" dominant-baseline="hanging" text-anchor="start" x="310" y="176"><tspan x="310" dy="0em">1. Registration &amp; Auth</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="150" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="160.85"><tspan x="810.0" dy="0em">POST /api/v3/actions/runner-registration  (returns listener token)</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="194" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="204.85"><tspan x="810.0" dy="0em">GET /_apis/distributedtask/pools?poolType=Automation</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="238" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="248.85"><tspan x="810.0" dy="0em">POST /pools/1/agents  (sends agent RSA public key)</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="282" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="292.85"><tspan x="810.0" dy="0em">POST /pools/1/sessions  (returns encrypted AES session key)</tspan></text><rect stroke="#334155" stroke-width="1" fill="#1e293b" x="1080" y="210" width="400" height="100" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#22c55e" dominant-baseline="hanging" text-anchor="start" x="1090" y="224.25"><tspan x="1090" dy="0em">Session Response:</tspan><tspan x="1090" dy="1.3em">{ "sessionId": "a8ad...",</tspan><tspan x="1090" dy="1.3em">  "encryptionKey": {</tspan><tspan x="1090" dy="1.3em">    "type": "RSA-wrapped-AES",</tspan><tspan x="1090" dy="1.3em">    "value": "base64_ciphertext" } }</tspan></text><ellipse stroke="#1e3a5f" stroke-width="1" fill="#3b82f6" cx="281.0" cy="427.0" rx="7.0" ry="7.0" /><text font-family="system-ui, sans-serif" font-size="15px" fill="#1e40af" dominant-baseline="hanging" text-anchor="start" x="310" y="416"><tspan x="310" dy="0em">2. Long-polling</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="396" width="460" height="60" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="411.7"><tspan x="810.0" dy="0em">GET /pools/1/messages?sessionId={guid}&amp;waitSeconds=50</tspan><tspan x="810.0" dy="1.3em">(returns 200 TaskAgentMessage on job, 202 on timeout)</tspan></text><rect stroke="#334155" stroke-width="1" fill="#1e293b" x="1080" y="380" width="400" height="90" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#22c55e" dominant-baseline="hanging" text-anchor="start" x="1090" y="389.25"><tspan x="1090" dy="0em">TaskAgentMessage Body (AES decrypted):</tspan><tspan x="1090" dy="1.3em">{</tspan><tspan x="1090" dy="1.3em">  "runner_request_id": "b95e454f-...",</tspan><tspan x="1090" dy="1.3em">  "run_service_url": "http://127.0.0.1:80/broker/1/"</tspan><tspan x="1090" dy="1.3em">}</tspan></text><ellipse stroke="#1e3a5f" stroke-width="1" fill="#3b82f6" cx="281.0" cy="557.0" rx="7.0" ry="7.0" /><text font-family="system-ui, sans-serif" font-size="15px" fill="#1e40af" dominant-baseline="hanging" text-anchor="start" x="310" y="546"><tspan x="310" dy="0em">3. Broker Job Acquire</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="508" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="518.85"><tspan x="810.0" dy="0em">POST /broker/1/acquirejob  (returns workflow, variables, contexts)</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="552" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="562.85"><tspan x="810.0" dy="0em">POST /broker/1/renewjob  (heartbeat every 60 seconds)</tspan></text><ellipse stroke="#1e3a5f" stroke-width="1" fill="#3b82f6" cx="281.0" cy="807.0" rx="7.0" ry="7.0" /><text font-family="system-ui, sans-serif" font-size="15px" fill="#1e40af" dominant-baseline="hanging" text-anchor="start" x="310" y="796"><tspan x="310" dy="0em">4. Execution &amp; Step Feeds</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="620" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="630.85"><tspan x="810.0" dy="0em">PATCH /_apis/v1/Timeline/... (step updates: state, duration, results)</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="656" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="666.85"><tspan x="810.0" dy="0em">POST /_apis/v1/Logfiles/... (create + append step log chunks)</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="692" width="460" height="50" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="702.7"><tspan x="810.0" dy="0em">POST /twirp/github.actions.results.api.v1.WorkflowStepUpdateService</tspan><tspan x="810.0" dy="1.3em">POST /twirp/results.services.receiver.Receiver/*</tspan></text><rect stroke="#dc2626" stroke-width="1" fill="#fee2e2" stroke-dasharray="6,6" x="580" y="748" width="460" height="60" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="10px" fill="#991b1b" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="758.5"><tspan x="810.0" dy="0em">POST /twirp/...CacheService/*  (GetCacheEntryDownloadURL, etc.)</tspan><tspan x="810.0" dy="1.3em">POST /twirp/...ArtifactService/* (CreateArtifact, FinalizeArtifact, etc.)</tspan><tspan x="810.0" dy="1.3em">(STUB — returns shape-correct 200 but no real storage backend)</tspan></text><rect stroke="#1e40af" stroke-width="1" fill="#dbeafe" stroke-dasharray="6,6" x="580" y="814" width="460" height="60" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="10px" fill="#1e40af" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="824.5"><tspan x="810.0" dy="0em">POST launch.actions.githubusercontent.com/actions/build/...</tspan><tspan x="810.0" dy="1.3em">GET codeload.github.com/actions/checkout/tar.gz/...</tspan><tspan x="810.0" dy="1.3em">(NOT IMPLEMENTED — runner connects directly to GitHub)</tspan></text><ellipse stroke="#1e3a5f" stroke-width="1" fill="#3b82f6" cx="281.0" cy="1067.0" rx="7.0" ry="7.0" /><text font-family="system-ui, sans-serif" font-size="15px" fill="#1e40af" dominant-baseline="hanging" text-anchor="start" x="310" y="1056"><tspan x="310" dy="0em">5. Completion</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="960" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="970.85"><tspan x="810.0" dy="0em">POST /_apis/v1/FinishJob/...  (delivers job outputs + result)</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="996" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="1006.85"><tspan x="810.0" dy="0em">POST /broker/1/completejob  (releases the job lease in aksh)</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="1032" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="1042.85"><tspan x="810.0" dy="0em">DELETE /pools/1/sessions  (teardown session)</tspan></text><rect stroke="#047857" stroke-width="1" fill="#a7f3d0" x="580" y="1068" width="460" height="34" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="810.0" y="1078.85"><tspan x="810.0" dy="0em">DELETE /pools/1/agents/4  (deregisters agent on clean listener exit)</tspan></text><rect stroke="#64748b" stroke-width="1" fill="#f8fafc" x="1080" y="960" width="400" height="140" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="14px" fill="#374151" dominant-baseline="hanging" text-anchor="middle" x="1280.0" y="968"><tspan x="1280.0" dy="0em">Legend</tspan></text><text font-family="system-ui, sans-serif" font-size="11px" fill="#374151" dominant-baseline="hanging" text-anchor="start" x="1094" y="994"><tspan x="1094" dy="0em">Solid green border  =  working end-to-end</tspan><tspan x="1094" dy="1.3em">Dashed red border   =  stub / shape-correct 200</tspan><tspan x="1094" dy="1.3em">                             no real storage or network call</tspan><tspan x="1094" dy="1.3em">Dashed blue border  =  not implemented</tspan></text></svg>