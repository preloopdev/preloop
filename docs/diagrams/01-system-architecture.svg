<svg xmlns="http://www.w3.org/2000/svg" width="2224" height="1272" viewBox="6 -32 2224 1272" style="background-color: #ffffff;"><defs><marker id="arrow-1e3a5f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e3a5f" /></marker><marker id="arrow-c2410c" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" /></marker><marker id="arrow-047857" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#047857" /></marker></defs><text font-family="system-ui, sans-serif" font-size="46px" fill="#1e40af" dominant-baseline="hanging" text-anchor="middle" x="1100.0" y="18"><tspan x="1100.0" dy="0em">aksh</tspan></text><text font-family="system-ui, sans-serif" font-size="17px" fill="#3b82f6" dominant-baseline="hanging" text-anchor="middle" x="1100.0" y="72"><tspan x="1100.0" dy="0em">GitHub Actions Control Plane — the unmodified actions/runner connects here instead of GitHub</tspan></text><rect stroke="#6d28d9" stroke-width="1" fill="#f5f3ff" stroke-dasharray="6,6" x="640" y="108" width="860" height="38" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#6d28d9" dominant-baseline="hanging" text-anchor="middle" x="1070.0" y="118.55"><tspan x="1070.0" dy="0em">Preloop product layer = aksh  +  libkrun ephemeral microVM runner host</tspan></text><text font-family="system-ui, sans-serif" font-size="12px" fill="#64748b" dominant-baseline="hanging" text-anchor="start" x="60" y="158"><tspan x="60" dy="0em">WORKFLOW SUBMISSION</tspan></text><text font-family="system-ui, sans-serif" font-size="12px" fill="#64748b" dominant-baseline="hanging" text-anchor="middle" x="990.0" y="158"><tspan x="990.0" dy="0em">CONTROL PLANE</tspan></text><text font-family="system-ui, sans-serif" font-size="12px" fill="#64748b" dominant-baseline="hanging" text-anchor="middle" x="1820.0" y="158"><tspan x="1820.0" dy="0em">RUNNER + SUBSTRATES</tspan></text><path stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="6,6" d="M 490 150 L 490 1190" /><path stroke="#cbd5e1" stroke-width="1" fill="none" stroke-dasharray="6,6" d="M 1580 150 L 1580 1190" /><ellipse stroke="#c2410c" stroke-width="2" fill="#fed7aa" cx="260.0" cy="235.0" rx="190.0" ry="35.0" /><text font-family="system-ui, sans-serif" font-size="14px" fill="#7c2d12" dominant-baseline="hanging" text-anchor="middle" x="260.0" y="225.9"><tspan x="260.0" dy="0em">git push / workflow_dispatch / schedule</tspan></text><rect stroke="#1e3a5f" stroke-width="2" fill="#3b82f6" x="70" y="310" width="380" height="70" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#ffffff" dominant-baseline="hanging" text-anchor="middle" x="260.0" y="328.1"><tspan x="260.0" dy="0em">POST /api/v1/runs</tspan><tspan x="260.0" dy="1.3em">aksh-runner-client CLI or any HTTP client</tspan></text><rect stroke="#334155" stroke-width="1" fill="#1e293b" x="56" y="418" width="400" height="120" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="11px" fill="#22c55e" dominant-baseline="hanging" text-anchor="start" x="70" y="456.55"><tspan x="70" dy="0em">{ "workflow_yaml": "on:\n  push:\njobs:\n  build:\n    runs-on: ubuntu\n    steps: [...]\n",</tspan><tspan x="70" dy="1.3em">  "event": "push",  "repository": "org/repo",</tspan><tspan x="70" dy="1.3em">  "secrets": {},  "vars": {} }</tspan></text><text font-family="system-ui, sans-serif" font-size="12px" fill="#64748b" dominant-baseline="hanging" text-anchor="start" x="70" y="556"><tspan x="70" dy="0em">GET /api/v1/runs/:id/events.ndjson</tspan><tspan x="70" dy="1.3em">→ live NDJSON event stream for agents + UIs</tspan></text><rect stroke="#1e3a5f" stroke-width="3" fill="#dbeafe" x="520" y="192" width="1020" height="620" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="28px" fill="#1e40af" dominant-baseline="hanging" text-anchor="middle" x="1030.0" y="208"><tspan x="1030.0" dy="0em">aksh-runner-server</tspan></text><rect stroke="#047857" stroke-width="2" fill="#a7f3d0" x="540" y="268" width="460" height="340" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#047857" dominant-baseline="hanging" text-anchor="middle" x="770.0" y="279.55"><tspan x="770.0" dy="0em">AzDO Runner Protocol  (working end-to-end)</tspan></text><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="start" x="552" y="308"><tspan x="552" dy="0em">POST  /api/v3/actions/runner-registration</tspan><tspan x="552" dy="1.3em">GET   /_apis/distributedtask/pools</tspan><tspan x="552" dy="1.3em">POST  /pools/:id/agents   (RSA key)</tspan><tspan x="552" dy="1.3em">POST  /pools/:id/sessions (AES key)</tspan><tspan x="552" dy="1.3em">GET   /pools/:id/messages  waitSeconds=50</tspan><tspan x="552" dy="1.3em">DELETE /pools/:id/messages/:id  (ack)</tspan><tspan x="552" dy="1.3em">POST  /_apis/v1/AgentRequest/:pool/:req</tspan><tspan x="552" dy="1.3em">PATCH /_apis/v1/AgentRequest/:pool/:req</tspan><tspan x="552" dy="1.3em">POST  /broker/:id/acquirejob</tspan><tspan x="552" dy="1.3em">POST  /broker/:id/renewjob</tspan><tspan x="552" dy="1.3em">POST  /broker/:id/completejob</tspan><tspan x="552" dy="1.3em">PATCH /_apis/v1/Timeline/...</tspan><tspan x="552" dy="1.3em">POST  /_apis/v1/Logfiles/...</tspan><tspan x="552" dy="1.3em">POST  /_apis/v1/FinishJob/...</tspan><tspan x="552" dy="1.3em">GET   .../oidctoken?audience=...</tspan></text><rect stroke="#047857" stroke-width="2" fill="#a7f3d0" x="1060" y="268" width="460" height="140" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#047857" dominant-baseline="hanging" text-anchor="middle" x="1290.0" y="279.55"><tspan x="1290.0" dy="0em">Native REST + NDJSON  (working)</tspan></text><text font-family="system-ui, sans-serif" font-size="11px" fill="#065f46" dominant-baseline="hanging" text-anchor="start" x="1072" y="308"><tspan x="1072" dy="0em">POST /api/v1/runs       submit workflow</tspan><tspan x="1072" dy="1.3em">GET  /api/v1/runs/:id   status + outputs</tspan><tspan x="1072" dy="1.3em">GET  /api/v1/runs/:id/events.ndjson</tspan><tspan x="1072" dy="1.3em">POST /api/v1/runs/:id/cancel</tspan></text><rect stroke="#dc2626" stroke-width="2" fill="#fee2e2" stroke-dasharray="6,6" x="1060" y="428" width="460" height="100" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#dc2626" dominant-baseline="hanging" text-anchor="middle" x="1290.0" y="437.55"><tspan x="1290.0" dy="0em">Cache v4 + Artifact v4 twirp  (STUB — mocked)</tspan></text><text font-family="system-ui, sans-serif" font-size="10px" fill="#991b1b" dominant-baseline="hanging" text-anchor="start" x="1072" y="462"><tspan x="1072" dy="0em">CacheService: always returns cache miss, fake upload URLs</tspan><tspan x="1072" dy="1.3em">ArtifactService: fake upload URLs, ListArtifacts always []</tspan><tspan x="1072" dy="1.3em">No real storage backend — bytes are never persisted</tspan></text><rect stroke="#1e40af" stroke-width="2" fill="#dbeafe" stroke-dasharray="6,6" x="1060" y="548" width="460" height="76" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#1e40af" dominant-baseline="hanging" text-anchor="middle" x="1290.0" y="557.55"><tspan x="1290.0" dy="0em">Action resolution  (NOT IMPLEMENTED)</tspan></text><text font-family="system-ui, sans-serif" font-size="10px" fill="#1e40af" dominant-baseline="hanging" text-anchor="start" x="1072" y="582"><tspan x="1072" dy="0em">launch.actions.githubusercontent.com + codeload.github.com</tspan><tspan x="1072" dy="1.3em">Runner still calls GitHub directly — aksh is bypassed</tspan></text><text font-family="system-ui, sans-serif" font-size="12px" fill="#64748b" dominant-baseline="hanging" text-anchor="middle" x="1036.0" y="640"><tspan x="1036.0" dy="0em">crates:  aksh-runner-server  ·  aksh-gha-parser  ·  aksh-gha-expressions  ·  aksh-gha-protocol  ·  aksh-cache  ·  aksh-artifacts</tspan></text><text font-family="system-ui, sans-serif" font-size="11px" fill="#94a3b8" dominant-baseline="hanging" text-anchor="middle" x="1036.0" y="666"><tspan x="1036.0" dy="0em">state: in-memory only (no persistence between restarts)  ·  any number of simultaneous runners supported</tspan></text><text font-family="system-ui, sans-serif" font-size="13px" fill="#047857" dominant-baseline="hanging" text-anchor="middle" x="1800.0" y="208"><tspan x="1800.0" dy="0em">Official actions/runner binary</tspan><tspan x="1800.0" dy="1.3em">(unmodified — thinks it's talking to GitHub)</tspan></text><ellipse stroke="#047857" stroke-width="2" fill="#a7f3d0" cx="1798.0" cy="286.0" rx="170.0" ry="30.0" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="1798.0" y="277.55"><tspan x="1798.0" dy="0em">Runner 1  ·  libkrun microVM</tspan></text><ellipse stroke="#047857" stroke-width="2" fill="#a7f3d0" cx="1798.0" cy="376.0" rx="170.0" ry="30.0" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="1798.0" y="367.55"><tspan x="1798.0" dy="0em">Runner 2  ·  Docker / Podman</tspan></text><ellipse stroke="#047857" stroke-width="2" fill="#a7f3d0" cx="1798.0" cy="466.0" rx="170.0" ry="30.0" /><text font-family="system-ui, sans-serif" font-size="13px" fill="#065f46" dominant-baseline="hanging" text-anchor="middle" x="1798.0" y="457.55"><tspan x="1798.0" dy="0em">Runner 3  ·  bare process / remote host</tspan></text><text font-family="system-ui, sans-serif" font-size="12px" fill="#64748b" dominant-baseline="hanging" text-anchor="middle" x="1798.0" y="516"><tspan x="1798.0" dy="0em">Each runner executes jobs in isolation.</tspan><tspan x="1798.0" dy="1.3em">The substrate is pluggable — aksh doesn't</tspan><tspan x="1798.0" dy="1.3em">care which one the runner host uses.</tspan></text><path stroke="#c2410c" stroke-width="2" fill="none" d="M 452 235 L 520 235" marker-end="url(#arrow-c2410c)" /><path stroke="#1e3a5f" stroke-width="2" fill="none" d="M 452 345 L 520 345" marker-end="url(#arrow-1e3a5f)" /><path stroke="#047857" stroke-width="2" fill="none" d="M 1540 286 L 1628 286" marker-end="url(#arrow-047857)" /><path stroke="#047857" stroke-width="2" fill="none" d="M 1540 376 L 1628 376" marker-end="url(#arrow-047857)" /><path stroke="#047857" stroke-width="2" fill="none" d="M 1540 466 L 1628 466" marker-end="url(#arrow-047857)" /><rect stroke="#64748b" stroke-width="1" fill="#f8fafc" x="1608" y="616" width="380" height="130" rx="8" ry="8" /><text font-family="system-ui, sans-serif" font-size="14px" fill="#374151" dominant-baseline="hanging" text-anchor="middle" x="1798.0" y="624"><tspan x="1798.0" dy="0em">Legend</tspan></text><text font-family="system-ui, sans-serif" font-size="11px" fill="#374151" dominant-baseline="hanging" text-anchor="start" x="1624" y="650"><tspan x="1624" dy="0em">Solid green border  =  working end-to-end</tspan><tspan x="1624" dy="1.3em">Dashed red border   =  stub / shape-correct 200</tspan><tspan x="1624" dy="1.3em">                             no real storage or network call</tspan><tspan x="1624" dy="1.3em">Dashed blue border  =  not implemented</tspan></text><path stroke="#e2e8f0" stroke-width="1" fill="none" d="M 60 800 L 2180 800" /><text font-family="system-ui, sans-serif" font-size="14px" fill="#1e40af" dominant-baseline="hanging" text-anchor="middle" x="1120.0" y="816"><tspan x="1120.0" dy="0em">Submit YAML  →  aksh parses, expands matrix, gates on needs  →  dispatches encrypted job to runner  →  runner executes  →  logs + timeline stream back  →  outputs available</tspan></text></svg>