<script>
const N={"01-system-overview": "1. System Overview", "02-control-plane": "2. Control Plane", "03-runner-listener-worker": "3. Runner Listener + Worker", "04-parser-pipeline": "4. Parser Pipeline", "05-expression-engine": "5. Expression Engine", "06-protocol-layer": "6. Protocol Layer", "07-orchestrator-backends": "7. Orchestrator Backends", "08-job-lifecycle": "8. Job Lifecycle Sequence"};
let af=Object.keys(N)[0],sc=1,px=0,py=0;
function at(){document.getElementById("host").style.transform=
"translate("+px+"px,"+py+"px) scale("+sc+")"}
function z(f){
const v=document.getElementById("vp");
const cx=v.clientWidth/2,cy=v.clientHeight/2;
px=cx-(cx-px)*f;py=cy-(cy-py)*f;
sc=Math.max(.1,Math.min(5,sc*f));at()}
function r(){sc=1;px=0;py=0;at()}
function ft(){
const svg=document.querySelector(".dia.show svg");
if(!svg)return;const v=document.getElementById("vp");
const vw=v.clientWidth-40,vh=v.clientHeight-40;
const sw=svg.clientWidth,sh=svg.clientHeight;
sc=Math.min(vw/sw,vh/sh,1);
px=(vw-sw*sc)/2+20;py=(vh-sh*sc)/2+20;at()}
function sa(name){
af=name;
document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("active",a.dataset.f===name));
document.querySelectorAll(".dia").forEach(d=>{d.classList.toggle("show",d.id==="d_"+name);
if(d.id==="d_"+name)d.style.display="block";else d.style.display="none"});
document.getElementById("tt").textContent=N[name]||name;
sc=1;px=0;py=0;ft()}
const nl=document.getElementById("nl");
Object.keys(N).forEach(k=>{
const li=document.createElement("li");
const a=document.createElement("a");
a.href="#";a.dataset.f=k;
a.innerHTML='<span class="num">'+k.split("-")[0]+'</span>'+N[k];
a.addEventListener("click",e=>{e.preventDefault();sa(k)});
li.appendChild(a);nl.appendChild(li)});
let dr=false,lx=0,ly=0;
document.addEventListener("mousedown",e=>{
if(e.target.closest("nav")||e.target.closest("header"))return;
dr=true;lx=e.clientX;ly=e.clientY});
document.addEventListener("mouseup",()=>dr=false);
document.addEventListener("mousemove",e=>{
if(!dr)return;px+=e.clientX-lx;py+=e.clientY-ly;
lx=e.clientX;ly=e.clientY;at()});
document.addEventListener("wheel",e=>{
if(e.target.closest("nav"))return;e.preventDefault();
const f=e.deltaY<0?1.1:.9;
const v=document.getElementById("vp");
const rc=v.getBoundingClientRect();
const mx=e.clientX-rc.left,my=e.clientY-rc.top;
px=mx-(mx-px)*f;py=my-(my-py)*f;
sc=Math.max(.1,Math.min(5,sc*f));at()},{passive:false});
sa(af);window.addEventListener("resize",ft);
</script></body></html>
