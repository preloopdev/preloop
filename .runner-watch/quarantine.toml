# Golden captures excluded from the conformance gate because the recording
# itself is wrong, not because preloop diverges from it.
#
# The MITM recorder dispatches a workflow to GitHub, then starts a generic
# `self-hosted` runner in a shared capture repo. That runner asks "got any
# work?" — GitHub hands it whatever is at the head of the repo's queue, not
# necessarily the job just dispatched. A scenario with a `needs:` edge only
# queues its downstream job *after* its upstream finishes, i.e. after that
# scenario's capture window closed. The next scenario's runner then picks up
# the leftover. Contamination is therefore always N poisoning N+1, and only
# from multi-job scenarios.
#
# Two independent proofs identified these three, and only these three, out of
# 39 (see `benchmarks/conformance/check_corpus.py`, which now enforces both):
#
#   1. A GitHub orchestration plan GUID identifies exactly one workflow run,
#      so the same GUID cannot legitimately appear in two scenario captures.
#   2. A capture's acquired job must be a job its own workflow declares.
#
# Captures are preserved under `.runner-watch/quarantine/v<version>/` rather
# than deleted: they are still real GitHub protocol output, just of the wrong
# job, and they remain useful as wire-shape evidence.
#
# Removing an entry requires re-recording that scenario against a drained
# queue. The invariants above then fail closed if contamination recurs.

