[description]
what = '''
NodeUtil: _defaultNodeVersion "node20" -> "node24";
BuiltInNodeVersions now ["node20", "node24"]. This is the runner's INTERNAL
node (NodeHandler housekeeping: internal actions like checkout internals,
telemetry, any node-executed runner plumbing) — not the job-side JS-action
migration (already gated by actions.runner.usenode24bydefault etc.).
'''
why = '''
Upstream defaults internal execution to Node 24 now that node24 externals
ship in every runner package.
'''
runner_behavior = '''
Internal node resolves to externals/node24 by default;
ACTIONS_RUNNER_FORCED_INTERNAL_NODE_VERSION still overrides;
node20 remains a built-in fallback.
'''
failure_mode = '''
If preloop-runner still resolves internal housekeeping to node20 it stays
functional but diverges from official runner process behavior (and from any
capture asserting the node path the runner execs for internal steps).
'''

[wire]
request = "N/A — runner-internal process selection."
expected_response = "externals/node24 used for internal node execution; env override honored"

