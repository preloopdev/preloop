[description]
what = '''
New file src/Runner.Common/VSockSecretNotifier.cs: on Linux, when
GITHUB_ACTIONS_RUNNER_VSOCK_CID_PORT is set ("CID:PORT"), the runner opens a
vsock connection to the host and forwards newly-registered secrets so the
host-side secret store masks them outside the guest (GitHub-hosted VM
isolation). Worker.cs wires SecretMasker.NewSecretAdded → NotifyNewSecret.
'''
why = '''
Hosted runners run inside a guest; secrets must also be masked in the host
log pipeline.
'''
runner_behavior = '''
Linux + env present → vsock notify on each new masked secret; otherwise no-op.
'''
failure_mode = '''
preloop-runner jobs run inside smolvm/AgentENV microVMs, not a vsock
boundary; no equivalent host channel exists. DEFERRED: implement only if a
vsock host channel is introduced. Recorded so the delta is accounted for.
'''

