change_id = "background-step-timeline-fields"
upstream_version = "v2.335.1"
category = "blocker"
tags = ["protocol", "timeline"]
ai_status = "deterministic-known-fidelity-gap"

[description]
what = '''
Runner can send background-step metadata in timeline records.
'''
why = '''
v2.335.0 records concurrent background steps and control-flow waits/cancels in timeline PATCH payloads.
'''
runner_behavior = '''
PATCH timeline records may include isBackground, backgroundControlType, backgroundControlStepIds, and parallelGroupId.
'''
failure_mode = '''
Aksh must accept and preserve unknown timeline metadata; strict DTOs or storage projections can silently lose fidelity.
'''

[feature_flag]
name = ""
where = ""

[wire]
request = '''
PATCH /_apis/v1/Timeline/{scope}/{hub}/{planId}/{timelineId}
{"value":[{"isBackground":true,"backgroundControlType":"waitAll","backgroundControlStepIds":["..."],"parallelGroupId":"..."}]}
'''
expected_response = "200 JSON timeline record collection"

[aksh_targets]
files = [
  { crate = "aksh-gha-protocol", path = "crates/aksh-gha-protocol/src/azdo.rs", area = "TimelineRecord DTO" },
  { crate = "aksh-runner-server", path = "crates/aksh-runner-server/src/lib.rs", area = "timeline handlers" },
]

[implementation]
approach = '''
Add optional serde fields to TimelineRecord and ensure timeline PATCH handlers round-trip/store them.
'''
test = "Serde test for camelCase optional background fields and handler test for timeline PATCH accepting them."

