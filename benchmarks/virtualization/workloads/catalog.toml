# Workload names are part of the benchmark contract. Implementations must
# remain bounded and produce a deterministic SHA-256 result.
workloads = [
  "noop",
  "cpu",
  "memory",
  "disk-seq",
  "disk-rand",
  "metadata",
  "network",
  "checkout-build",
  "docker",
  "service-container",
]

# Representative repositories are immutable inputs, not floating branches.
# These are the previously recorded workflow slices; execution must still
# verify that each path exists at its pinned commit before freezing a campaign.
[real_workflows.ripgrep]
repository = "BurntSushi/ripgrep"
commit = "f9c05a949d1a0dc8e16dee28ca9605d38611faeb"
workflow = ".github/workflows/ci.yml"
job = "rustfmt"

[real_workflows.flask]
repository = "pallets/flask"
commit = "36e4a824f340fdee7ed50937ba8e7f6bc7d17f81"
workflow = ".github/workflows/pre-commit.yaml"
job = "main"

[real_workflows.vite]
