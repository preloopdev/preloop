name: Axum CI
on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_HOME: /home/bnjoroge/.cargo
  RUSTUP_HOME: /home/bnjoroge/.rustup
  RUSTUP_TOOLCHAIN: stable

jobs:
  ci:
    name: Axum CI
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Setup Rust PATH
        run: |
          echo "/home/bnjoroge/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin" >> $GITHUB_PATH
          echo "/home/bnjoroge/.cargo/bin" >> $GITHUB_PATH
      - name: Rust version
        run: rustc --version && cargo --version
      - name: Rustfmt
        run: cd /tmp/bench-repos/axum && cargo fmt --all --check
      - name: Clippy
        run: cd /tmp/bench-repos/axum && cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cd /tmp/bench-repos/axum && cargo test --workspace --all-features
        env:
          RUST_BACKTRACE: 1
      - name: Doc
        run: cd /tmp/bench-repos/axum && cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings
