name: Serde CI
on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_HOME: /home/bnjoroge/.cargo
  RUSTUP_HOME: /home/bnjoroge/.rustup

jobs:
  ci:
    name: Serde CI
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Setup Rust PATH
        run: |
          echo "/home/bnjoroge/.rustup/toolchains/1.86.0-x86_64-unknown-linux-gnu/bin" >> $GITHUB_PATH
          echo "/home/bnjoroge/.cargo/bin" >> $GITHUB_PATH
      - name: Rust version
        run: rustc --version && cargo --version
      - name: Rustfmt
        run: cd /tmp/bench-repos/serde && cargo fmt --all --check
      - name: Build serde
        run: cd /tmp/bench-repos/serde/serde && cargo build --features rc
      - name: Build serde (no default)
        run: cd /tmp/bench-repos/serde/serde && cargo build --no-default-features
      - name: Clippy serde
        run: cd /tmp/bench-repos/serde/serde && cargo clippy --features rc
      - name: Clippy serde_derive
        run: cd /tmp/bench-repos/serde/serde_derive && cargo clippy
      - name: Test serde_core
        run: cd /tmp/bench-repos/serde/serde_core && cargo test --features rc
      - name: Test serde_derive
        run: cd /tmp/bench-repos/serde/serde_derive && cargo test
