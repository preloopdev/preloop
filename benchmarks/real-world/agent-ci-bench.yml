name: Agent CI Project
on:
  push:
  workflow_dispatch:

jobs:
  ci:
    name: Agent CI Project CI
    runs-on: self-hosted
    timeout-minutes: 60
    container: node:24-bookworm
    steps:
      - name: Runtime versions
        run: |
          cd "$GITHUB_WORKSPACE"
          node --version
          npm install --global pnpm@10.30.1
          pnpm --version
          git --version
      - name: Install dependencies
        run: cd "$GITHUB_WORKSPACE" && pnpm install --frozen-lockfile
      - name: Check
        run: cd "$GITHUB_WORKSPACE" && pnpm check
      - name: Test
        run: cd "$GITHUB_WORKSPACE" && pnpm test
