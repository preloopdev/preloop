name: Bat CI
on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_HOME: /home/bnjoroge/.cargo
  RUSTUP_HOME: /home/bnjoroge/.rustup
  RUSTUP_TOOLCHAIN: stable

jobs:
  ci:
    name: Bat CI
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Setup Rust PATH
        run: |
          echo "/home/bnjoroge/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin" >> $GITHUB_PATH
          echo "/home/bnjoroge/.cargo/bin" >> $GITHUB_PATH
      - name: Rust version
        run: rustc --version && cargo --version
      - name: Rustfmt
        run: cd /tmp/bench-repos/bat && cargo fmt --all --check
      - name: Build
        run: cd /tmp/bench-repos/bat && cargo build --locked
      - name: Clippy
        run: cd /tmp/bench-repos/bat && cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cd /tmp/bench-repos/bat && cargo test --locked
        env:
          RUST_BACKTRACE: 1
