# Preloop engine descriptor ceiling: every VMM the engine starts inherits the
# service unit's LimitNOFILE, and SmolVM's virtiofs passthrough holds one host
# fd per image inode a guest has looked up (the x86_64 golden carries ~985k).
# Linux refuses an RLIMIT_NOFILE hard limit above fs.nr_open, so the unit
# cannot ask for more than this. `preloop server install` writes this file and
# removes it on uninstall; a hand install copies it to /etc/sysctl.d/ and runs
# `sysctl -w fs.nr_open=2097152` for the current boot.
fs.nr_open = 2097152
