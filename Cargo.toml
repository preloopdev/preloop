[workspace]
members = [
    "crates/aksh-artifacts",
    "crates/aksh-cache",
    "crates/aksh-dap",
    "crates/aksh-conformance",
    "crates/aksh-gha-expressions",
    "crates/aksh-gha-parser",
    "crates/aksh-gha-protocol",
    "crates/aksh-runner",
    "crates/aksh-runner-client",
    "crates/aksh-runner-server",
    "crates/runner-watch",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/preloop/preloop"
rust-version = "1.86"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
rcgen = "0.13"
base64 = "0.22"
bytes = "1.6"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
indexmap = { version = "2.2", features = ["serde"] }
proptest = "1.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
tempfile = "3.10"
parking_lot = "0.12"
thiserror = "1.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util", "io-std", "process"] }
tokio-util = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
rsa = "0.9"
walkdir = "2.5"
toml = "0.8"
regex = "1.10"
similar = "2.5"

command-group = { version = "5", features = ["with-tokio"] }
flate2 = "1"
tar = "0.4"
glob = "0.3"
hostname = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true