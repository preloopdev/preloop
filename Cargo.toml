[workspace]
members = [
    "crates/preloop-artifacts",
    "crates/preloop-cache",
    "crates/preloop-dap",
    "crates/preloop-conformance",
    "crates/preloop-gha-expressions",
    "crates/preloop-gha-parser",
    "crates/preloop-gha-protocol",
    "crates/preloop-runner",
    "crates/preloop-runner-client",
    "crates/preloop-runner-server",
    "crates/runner-watch",
    "crates/preloop-vm",
    "crates/preloop-orchestrator",
    "crates/preloop-socket-activation",
    "crates/preloop-cli",
    "crates/preloop-observability",
    "benchmarks/preloop-perf",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/preloopdev/preloop"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
hyper = "1.0"
hyper-util = { version = "0.1", features = ["full"] }
rcgen = "0.13"
base64 = "0.22"
bytes = "1.6"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
indexmap = { version = "2.2", features = ["serde"] }
proptest = "1.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form", "query", "blocking"] }
serde = { version = "1.0", features = ["derive", "rc"] }
rand = "0.8"
# `preserve_order` keeps `Value::Object` in document order instead of sorting
# keys. GitHub renders a matrix job name by walking the matrix mapping as
# written (`JobNameBuilder`), so a `fromJSON` matrix declaring `os` before
# `arch` must name the job `build (ubuntu-latest, x64)`. Sorted keys silently
# reorder every dynamic-matrix job id.
serde_json = { version = "1.0", features = ["preserve_order"] }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio-postgres = "0.7"
postgres_rustls = "0.1"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"
serde_yaml = "0.9"
rpassword = "7"
sha2 = { version = "0.10", features = ["oid"] }
sha1 = "0.10"
hmac = "0.12"
tempfile = "3.10"
parking_lot = "0.12"
thiserror = "1.0"
tokio = { version = "1.37", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util", "io-std", "process"] }
tokio-util = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["rustls-tls-webpki-roots", "connect"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio", "experimental_metrics_custom_reader"] }
# OTLP/HTTP only — never the tonic/gRPC stack (plan §435-437, §1289). Reuses
# the workspace reqwest (now 0.13, same line the SDK targets) through
# `opentelemetry_http::HttpClient`, so there is exactly one HTTP client.
# `reqwest-blocking-client` lets the SDK's plain-thread batch/periodic
# processors export (an async client never completes off-runtime).
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "trace", "metrics", "logs", "reqwest-blocking-client"] }
opentelemetry-http = { version = "0.32", default-features = false, features = ["reqwest"] }
opentelemetry-appender-tracing = "0.32"
opentelemetry-semantic-conventions = "0.32"
uuid = { version = "1.8", features = ["v4", "serde"] }
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
rsa = "0.9"
walkdir = "2.5"
toml = "0.8"
regex = "1.10"
x509-parser = { version = "0.16", features = ["verify"] }
similar = "2.5"
cron = "0.12"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
utoipa = { version = "5", features = ["uuid", "chrono"] }

command-group = { version = "5", features = ["with-tokio"] }
flate2 = "1"
tar = "0.4"
glob = "0.3"
hostname = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
self-replace = "1.5"
semver = "1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.build-override]
# Proc macros and build scripts are executed, not shipped; optimize them
# so the compiler spends less time inside them during dev/test builds.
opt-level = 3

[profile.test]
# CI test binaries: skip DWARF emission (smaller artifacts, faster codegen
# and link). Panic backtraces lose line numbers in tests — acceptable.
debug = 0

[profile.dist]
inherits = "release"