name: Pullfrog (GHES-compatible fork)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for the agent'
        required: false
        default: 'List the files in this repo and summarize the README in one paragraph.'
  issue_comment:
    types: [created]

# `contents` to push review fixes to the PR branch; `pull-requests` and
# `issues` for reviews, comments and check runs. Deliberately no `id-token`:
# this run authenticates with `GH_TOKEN` below, and Pullfrog's server only
# accepts OIDC tokens from GitHub's own issuer.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pullfrog:
    # `@pullfrog …` (or `/pullfrog …`) from someone with write access only:
    # the repo is public, so an unrestricted comment trigger would spend the
    # model credentials for any GitHub user.
    #
    # Fork PRs never run from an `issue_comment` trigger: its payload carries no
    # head repo, so the first step below resolves the PR's head through the API
    # and skips the rest of the job. (A fork run could not work anyway: it gets a
    # read-only `GITHUB_TOKEN` and no secrets, so the action finds neither a
    # writable token nor the model credentials it needs.)
    if: >
       (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'issue_comment' &&
         (contains(github.event.comment.body, '@pullfrog') || contains(github.event.comment.body, '/pullfrog')) &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) &&
       github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' &&
       github.actor != 'pullfrog[bot]'
    # One review per PR: a newer commit or request supersedes the running one.
    # Job-level, so the comments the `if:` above skips never enter the group,
    # and a group per PR, so one PR's push never cancels another PR's review.
    concurrency:
      group: pullfrog-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    runs-on: [self-hosted, preloop-cpane]
    timeout-minutes: 60
    steps:
      # `issue_comment` payloads carry no head repo, so resolve it through the
      # API URL the payload itself names and gate every later step on it. An
      # unresolved or failed lookup skips the run, so the gate fails closed.
      # Comments on plain issues have no PR to resolve and are unaffected.
      - name: Skip fork PRs on comment triggers
        id: fork_gate
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          head=""
          if body=$(curl -fsS --max-time 30 \
                       -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       "$PR_URL"); then
            head=$(printf '%s' "$body" | python3 -c \
              'import json,sys; print((json.load(sys.stdin).get("head",{}).get("repo") or {}).get("full_name",""))' \
              2>/dev/null || true)
          fi
          if [ "$head" = "$GITHUB_REPOSITORY" ]; then
            echo "fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "fork=true" >> "$GITHUB_OUTPUT"
            echo "::warning::pullfrog: @pullfrog on a PR whose head is '${head:-unresolved}' (this repo is $GITHUB_REPOSITORY); skipping the run."
          fi

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: steps.fork_gate.outputs.fork != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for reviewable platform changes
        id: diff_filter
        if: steps.fork_gate.outputs.fork != 'true'
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Ensure npm and npx are available
        if: steps.fork_gate.outputs.fork != 'true'
        run: |
          for node_dir in /opt/actions-runner/externals*/node*; do
            if [ -d "$node_dir/bin" ] && [ -f "$node_dir/lib/node_modules/npm/bin/npm-cli.js" ]; then
              printf '#!/usr/bin/env sh\nexec node "%s" "$@"\n' "$node_dir/lib/node_modules/npm/bin/npx-cli.js" > "$node_dir/bin/npx" || true
              printf '#!/usr/bin/env sh\nexec node "%s" "$@"\n' "$node_dir/lib/node_modules/npm/bin/npm-cli.js" > "$node_dir/bin/npm" || true
              chmod +x "$node_dir/bin/npx" "$node_dir/bin/npm" || true
              echo "$node_dir/bin" >> "$GITHUB_PATH"
            fi
          done || true

      - name: Run Pullfrog (via GHES-compatible fork)
        if: steps.fork_gate.outputs.fork != 'true' && steps.diff_filter.outputs.skip != 'true'
        continue-on-error: true
        uses: preloopdev/pullfrog@ee5bcaf5557b069f78177ec0a33381c9e5477cf4 # main
        with:
          prompt: ${{ inputs.prompt || toJSON(github.event) }}
          model: anthropic/claude-sonnet-5-5
          effort: high
        env:
          # LOAD-BEARING, do not delete: the action clones into
          # `pullfrog-XXXXXX` under the system temp dir and never cleans up.
          # `runner.temp` is disk-backed and cleared between jobs; without
          # this, leaked clones fill whatever backs TMPDIR.
          TMPDIR: ${{ runner.temp }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The token must have `pull-requests: write` to publish reviews.
          # Prefer an explicitly configured token; otherwise use the workflow
          # token, subject to the permissions granted to this run.
          GH_TOKEN: ${{ secrets.PULLFROG_GH_TOKEN || github.token }}
