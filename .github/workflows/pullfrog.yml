name: Pullfrog (GHES-compatible fork)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt for the agent'
        required: false
        default: 'List the files in this repo and summarize the README in one paragraph.'
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened]

# The action uses `GH_TOKEN` for GitHub API and git access.
# `id-token` is not required.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  pullfrog:
    # Only authorized commenters can trigger reviews. Fork pull requests are
    # excluded because their workflows do not receive secrets or write access.
    # The event-specific guards below enforce both restrictions.
    if: >
       (github.event_name == 'workflow_dispatch' ||
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' &&
         (contains(github.event.comment.body, '@pullfrog') || contains(github.event.comment.body, '/pullfrog')) &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) &&
       (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository) &&
       github.actor != 'renovate[bot]' && github.actor != 'dependabot[bot]' &&
       github.actor != 'pullfrog[bot]'
    # Keep one active review per PR; newer commits or requests supersede the
    # previous review without cancelling reviews for other PRs.
    concurrency:
      group: pullfrog-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    runs-on: [self-hosted, preloop-cpane]
    timeout-minutes: 60
    steps:
      # Comment events do not include the PR head repository. Resolve it
      # through the API and fail closed when the lookup fails or finds a fork.
      - name: Skip fork PRs on comment triggers
        id: fork_gate
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          head=""
          if body=$(curl -fsS --max-time 30 \
                       -H "Authorization: Bearer $GH_TOKEN" \
                       -H "Accept: application/vnd.github+json" \
                       "$PR_URL"); then
            head=$(printf '%s' "$body" | python3 -c \
              'import json,sys; print((json.load(sys.stdin).get("head",{}).get("repo") or {}).get("full_name",""))' \
              2>/dev/null || true)
          fi
          if [ "$head" = "$GITHUB_REPOSITORY" ]; then
            echo "fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "fork=true" >> "$GITHUB_OUTPUT"
            echo "::warning::pullfrog: @pullfrog on a PR whose head is '${head:-unresolved}' (this repo is $GITHUB_REPOSITORY); skipping the run."
          fi

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        if: steps.fork_gate.outputs.fork != 'true'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for reviewable platform changes
        id: diff_filter
        if: steps.fork_gate.outputs.fork != 'true'
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git fetch origin "$BASE_REF" --depth=1 >/dev/null 2>&1 && \
               CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD 2>/dev/null) && \
               [ -n "$CHANGED" ]; then
              CODE_CHANGED=$(echo "$CHANGED" | grep -vE '^(\.runner-watch/.*\.jsonl$|\.runner-watch/.*\.json$|docs/|.*\.md$)' || true)
              if [ -z "$CODE_CHANGED" ]; then
                echo "Only docs, markdown, and static golden captures changed. Skipping Pullfrog review to avoid unnecessary model charges."
                echo "skip=true" >> "$GITHUB_OUTPUT"
              else
                echo "Platform code or executable files changed:"
                echo "$CODE_CHANGED"
                echo "skip=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "Could not reliably determine git diff; running review."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure npm and npx are available
        if: steps.fork_gate.outputs.fork != 'true'
        run: |
          for node_dir in /opt/actions-runner/externals*/node*; do
            if [ -d "$node_dir/bin" ] && [ -f "$node_dir/lib/node_modules/npm/bin/npm-cli.js" ]; then
              printf '#!/usr/bin/env sh\nexec node "%s" "$@"\n' "$node_dir/lib/node_modules/npm/bin/npx-cli.js" > "$node_dir/bin/npx" || true
              printf '#!/usr/bin/env sh\nexec node "%s" "$@"\n' "$node_dir/lib/node_modules/npm/bin/npm-cli.js" > "$node_dir/bin/npm" || true
              chmod +x "$node_dir/bin/npx" "$node_dir/bin/npm" || true
              echo "$node_dir/bin" >> "$GITHUB_PATH"
            fi
          done || true

      - name: Run Pullfrog (via GHES-compatible fork)
        if: steps.fork_gate.outputs.fork != 'true' && steps.diff_filter.outputs.skip != 'true'
        continue-on-error: true
        uses: preloopdev/pullfrog@ee5bcaf5557b069f78177ec0a33381c9e5477cf4 # main
        with:
          prompt: ${{ inputs.prompt || toJSON(github.event) }}
          model: anthropic/claude-sonnet-5-5
          effort: high
        env:
          # Use runner.temp, which is cleared between jobs, for action clones.
          TMPDIR: ${{ runner.temp }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The token must have `pull-requests: write` to publish reviews.
          # Prefer an explicitly configured token; otherwise use the workflow
          # token, subject to the permissions granted to this run.
          GH_TOKEN: ${{ secrets.PULLFROG_GH_TOKEN || github.token }}
