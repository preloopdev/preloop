name: supply-chain
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly refresh of the RustSec advisory DB and vet imports.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Supply-chain gate: three independent checks.
#   cargo vet   - fails on any dependency version change that has not been
#                 re-vouched (the "same publisher, new malicious version"
#                 attack class — cf. the Aug 2026 keyv/npm worm).
#   cargo audit - RustSec advisory DB: known-vulnerable versions.
#   cargo deny  - advisories, license policy, banned crates, and source
#                 policy (crates.io only; no git/unknown registries).

jobs:
  audit-vet-deny:
    runs-on: self-hosted
    timeout-minutes: 30
    # Expensive (installs vet/audit/deny); PRs skip it. New dependency
    # versions are still caught at merge time by the push-triggered run.
    if: github.event_name != 'pull_request'
    steps:
      - name: Ensure git-lfs for LFS-tracked goldens
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            case $(uname -m) in
              aarch64|arm64) LFS_ARCH=arm64 ;;
              x86_64) LFS_ARCH=amd64 ;;
              *) echo "unsupported arch" >&2; exit 1 ;;
            esac
            curl -fsSL "https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-$LFS_ARCH-v3.7.1.tar.gz" -o /tmp/git-lfs.tgz
            tar -xzf /tmp/git-lfs.tgz -C /tmp
            mkdir -p "$HOME/bin"
            cp /tmp/git-lfs-3.7.1/git-lfs "$HOME/bin/git-lfs"
            chmod +x "$HOME/bin/git-lfs"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          git lfs install --skip-repo >/dev/null 2>&1 || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.86"

      # Prebuilt binaries, not `cargo install`: building these three from
      # source cost ~12 min of every run, and the pinned cargo-vet 0.10.1
      # never existed on crates.io (0.10.0 then 0.10.2), so the step failed
      # instantly with exit 101. install-action fetches release artifacts
      # and verifies their checksums in seconds.
      - name: Install supply-chain tools
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-vet@0.10.2,cargo-audit@0.22.2,cargo-deny@0.20.2

      # The gate's own policy files (deny.toml, supply-chain/, audit.toml)
      # are trusted inputs from main. A PR that edits them could exempt a
      # malicious dependency, so any PR touching them fails immediately.
      - name: Reject gate-config tampering in PRs
        if: github.event_name == 'pull_request'
        env:
          # The engine now injects GITHUB_TOKEN into the job's secret set
          # (GitHub's dispatcher substitutes it at dispatch time), so the
          # canonical spelling works here and on hosted runners alike.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The checkout above ran with `persist-credentials: false`, so the
          # clone holds no credential and this repo is private. The runner
          # masks secrets, so embedding the token in a URL or an env-var fetch
          # gets rewritten before the process starts and git sees an invalid
          # credential. Use the same mechanism actions/checkout itself uses:
          # a per-invocation extraheader, so nothing is persisted into the
          # clone for later steps to inherit.
          encoded=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${encoded}" \
            fetch --depth=1 origin main
          # Two-dot, not three: `A...B` needs a merge base, and neither side of
          # this comparison has one — the checkout and this fetch are both
          # depth 1. Comparing the trees answers the gate's actual question,
          # "do these files differ from main's tip".
          changed=$(git diff --name-only FETCH_HEAD HEAD -- deny.toml .cargo/audit.toml supply-chain/ || true)
          if [ -n "$changed" ]; then
            echo "supply-chain policy files must not change in PRs: $changed" >&2
            exit 1
          fi

      # Neutralize the article's attack vectors from the PR checkout:
      # `.cargo/config.toml` can alias any `cargo <tool>` to `run` or point
      # rustc at a repo script (shnatsel: "Do not run any cargo commands on
      # untrusted projects"). The repo's own config is gitignored, so any
      # `.cargo/config.toml` here was shipped by the PR — remove it. This
      # runs on the self-hosted pool, so the drop is load-bearing, not
      # cosmetic; the workflow token stays read-only.
      - name: Drop PR-shipped .cargo/config.toml
        run: rm -f .cargo/config.toml .cargo/config

      - name: cargo vet (dependency version-change gate)
        run: cargo vet

      - name: cargo audit (RustSec advisory DB)
        run: cargo audit --ignore RUSTSEC-2023-0071

      - name: cargo deny (advisories, licenses, bans, sources)
        run: cargo deny check all
