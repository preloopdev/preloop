name: supply-chain

on:
  # The policy workflow is base-controlled so a PR cannot disable it or
  # replace the policy/checker it is meant to enforce.
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- policy-only job; candidate code is never executed
  push:
    branches: [main]
  workflow_dispatch:

# This job never needs repository mutation or package publishing authority.
permissions: {}

jobs:
  policy:
    name: Cargo supply-chain policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out policy revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: policy
          fetch-depth: 0
          persist-credentials: false

      - name: Check out candidate revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Reject PR policy changes
        if: github.event_name == 'pull_request_target'
        working-directory: candidate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          forbidden="$(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
              '.cargo/**' \
              'deny.toml' \
              'scripts/check-build-script-hashes.py' \
              'supply-chain/**' \
              '.github/workflows/supply-chain.yml'
          )"
          if [ -n "$forbidden" ]; then
            printf 'supply-chain policy files must be updated in a trusted policy change:\n%s\n' "$forbidden" >&2
            exit 1
          fi

      # Use only the policy revision for Cargo configuration, deny/audit data,
      # and the checker itself. A PR cannot weaken the policy by changing
      # candidate/.cargo/config.toml or candidate/supply-chain/*.
      - name: Materialize trusted policy
        run: |
          set -euo pipefail
          rm -rf candidate/.cargo candidate/supply-chain
          mkdir -p candidate/.cargo
          cp policy/.cargo/config.toml candidate/.cargo/config.toml
          cp policy/.cargo/audit.toml candidate/.cargo/audit.toml
          cp policy/deny.toml candidate/deny.toml
          cp -R policy/supply-chain candidate/supply-chain
          cp policy/scripts/check-build-script-hashes.py candidate/scripts/check-build-script-hashes.py

      - name: Install pinned nightly Cargo
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-07-26

      # Fetch sources only. Cargo metadata/fetch does not compile or execute
      # dependency build scripts.
      - name: Fetch locked dependency sources
        working-directory: candidate
        run: cargo fetch --locked

      - name: Verify reviewed build-script hashes
        working-directory: candidate
        run: python3 scripts/check-build-script-hashes.py

      # The committed .cargo/config.toml makes future nightly lockfile
      # resolution reject registry versions younger than seven days. Keep this
      # invocation here so the policy is exercised in CI, not merely documented.
      - name: Exercise seven-day dependency cooldown
        working-directory: candidate
        run: cargo +nightly update -Z min-publish-age --dry-run --verbose

      - name: Install policy tools
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-audit@0.22.2

      - name: Install cargo-deny
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-deny@0.20.2

      - name: Run RustSec audit
        working-directory: candidate
        run: cargo audit

      - name: Run cargo-deny policy
        working-directory: candidate
        run: cargo deny check all
