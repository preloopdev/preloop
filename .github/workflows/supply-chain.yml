name: supply-chain
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  cargo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Drop PR-shipped cargo config
        run: rm -f .cargo/config.toml

      - name: Guard policy files
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          # Ensure base is fetched for diff
          git fetch --no-tags --depth=1 origin "$base" || true
          if git diff --name-only "$base"...HEAD | grep -Eq '^(deny\.toml|\.cargo/audit\.toml|supply-chain/)'; then
            echo "ERROR: PR touches supply-chain policy files (deny.toml, .cargo/audit.toml, supply-chain/*)" >&2
            echo "These files are supply-chain policy — bump them in a dedicated PR." >&2
            git diff --name-only "$base"...HEAD | grep -E '^(deny\.toml|\.cargo/audit\.toml|supply-chain/)' || true
            exit 1
          fi
          echo "Policy file guard: OK"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97"

      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-vet@0.10.8,cargo-audit@0.21.2,cargo-deny@0.18.4

      - name: cargo vet
        run: cargo vet --locked

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check all
        run: cargo deny check all

  node-externals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Audit Node externals (OSV + SBOM)
        run: bash scripts/audit-node-externals.sh

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-node-externals
          path: sbom-node-externals.cdx.json
          if-no-files-found: error

  check-node-pin-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Check Node pin parity against upstream externals.sh
        run: |
          set -euo pipefail
          runner_version="$(grep -E '^runner_version[[:space:]]*=' versions.toml | head -n1 | sed -E 's/.*"[[:space:]]*([^"]+)[[:space:]]*".*/\1/')"
          if [[ -z "$runner_version" ]]; then
            echo "failed to parse runner_version from versions.toml" >&2
            exit 1
          fi
          echo "runner_version from versions.toml: $runner_version"

          node20_local="$(grep -E '^node20_externals_version[[:space:]]*=' versions.toml | head -n1 | sed -E 's/.*"[[:space:]]*([^"]+)[[:space:]]*".*/\1/')"
          node24_local="$(grep -E '^node24_externals_version[[:space:]]*=' versions.toml | head -n1 | sed -E 's/.*"[[:space:]]*([^"]+)[[:space:]]*".*/\1/')"
          echo "Local pins: node20=$node20_local node24=$node24_local"

          url="https://raw.githubusercontent.com/actions/runner/v${runner_version}/src/Misc/externals.sh"
          echo "Fetching $url"
          curl -fsSL --retry 3 --retry-all-errors "$url" -o /tmp/externals.sh

          node20_upstream="$(grep -E 'NODE20_VERSION=' /tmp/externals.sh | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          node24_upstream="$(grep -E 'NODE24_VERSION=' /tmp/externals.sh | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "Upstream externals.sh: NODE20_VERSION=$node20_upstream NODE24_VERSION=$node24_upstream"

          drift=0
          if [[ "$node20_local" != "$node20_upstream" ]]; then
            echo "::error::node20_externals_version drift: versions.toml=$node20_local upstream externals.sh NODE20_VERSION=$node20_upstream (runner $runner_version)"
            drift=1
          fi
          if [[ "$node24_local" != "$node24_upstream" ]]; then
            echo "::error::node24_externals_version drift: versions.toml=$node24_local upstream externals.sh NODE24_VERSION=$node24_upstream (runner $runner_version)"
            drift=1
          fi

          if [[ "$drift" -ne 0 ]]; then
            echo "FAIL: Node pins have drifted from upstream actions/runner externals.sh" >&2
            echo "Update versions.toml to match upstream, then refresh externals handling (see crates/preloop-runner/src/configure.rs and docs)." >&2
            exit 1
          fi
          echo "Node pin parity: OK (node20=$node20_local node24=$node24_local matches runner $runner_version)"
