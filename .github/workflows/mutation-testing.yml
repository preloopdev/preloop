  mutants-T5-cli-parsing:
    name: mutants-T5-cli-parsing
    runs-on: [self-hosted, preloop-cpane]
    timeout-minutes: 240
    env:
      CARGO_BUILD_JOBS: "4"
      # The pg suites run against this server; each test creates (and drops)
      # its own database on it. Without a server they bootstrap disposable
      # clusters from initdb, and skip when they cannot — which would make
      # every control/pg mutant survive, so make the server mandatory here.
      PRELOOP_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/postgres
      PRELOOP_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /home/runner/.rustup/toolchains
            /home/runner/.rustup/settings.toml
          key: rustup-1.99-${{ runner.os }}-${{ runner.arch }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.99"
      - name: Select Rust toolchain binaries
        run: |
          toolchain_bin="$(dirname "$(rustup which rustc)")"
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          echo "RUSTC=$toolchain_bin/rustc" >> "$GITHUB_ENV"
          echo "RUSTDOC=$toolchain_bin/rustdoc" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_RUSTDOC=$toolchain_bin/rustdoc" >> "$GITHUB_ENV"
      - name: Start PostgreSQL (container)
        # Same pattern as control-plane.yml: the server runs in a container the
        # job owns — no apt, no pgdg repo, no host cluster. Trust auth on
        # loopback matches PRELOOP_TEST_POSTGRES_URL, and max_connections must
        # clear the two-node race tests (roughly 204 connections).
        run: |
          image="mirror.gcr.io/library/postgres:18"
          for attempt in 1 2 3; do
            if docker pull -q "$image"; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "could not pull $image" >&2
              exit 1
            fi
            sleep 5
          done
          docker run -d --name postgres --network host \
            -e POSTGRES_HOST_AUTH_METHOD=trust \
            "$image" -c max_connections=400
          for _ in $(seq 1 30); do
            if docker exec postgres pg_isready -U postgres -h 127.0.0.1 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready" >&2
          docker logs postgres --tail 50 >&2 || true
          exit 1
      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          version=0.9.144
          case "$(uname -m)" in
            x86_64)
              asset=linux
              digest=8a4f726272b0a1c499bd87ca3978bfbb1a8c20bb08ccf075b9996e2081bd1e1e
              ;;
            aarch64|arm64)
              asset=linux-arm
              digest=7fecfd431b810c05c589d800524286b8f80ce2fe9fb1fef05caf16d095cea407
              ;;
            *)
              echo "no pinned cargo-nextest build for $(uname -m)" >&2
              exit 1
              ;;
          esac
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://get.nexte.st/${version}/${asset}"
          echo "${digest}  ${archive}" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$archive" -C "$HOME/.local/bin" cargo-nextest
          "$HOME/.local/bin/cargo-nextest" --version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install cargo-mutants
        run: |
          set -euo pipefail
          version=27.1.0
          if [ "$(uname -m)" = x86_64 ]; then
            archive="$RUNNER_TEMP/cargo-mutants.tar.gz"
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/sourcefrog/cargo-mutants/releases/download/v${version}/cargo-mutants-x86_64-unknown-linux-gnu.tar.gz"
            echo "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e  ${archive}" | sha256sum -c -
            mkdir -p "$HOME/.local/bin"
            tar -xzf "$archive" -C "$HOME/.local/bin" cargo-mutants
            "$HOME/.local/bin/cargo-mutants" --version
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            cargo install cargo-mutants --version "$version" --locked
            cargo-mutants --version
          fi
      - name: Run mutation test T5 (CLI parsing)
        run: |
          cargo test --locked -p preloop-mutation --test mutation_targets -- \
            --ignored --exact t5_cli_parsing --nocapture
      - name: Report survivors
        if: always()
        run: |
          out=mutants.out/T5/mutants.out
          {
            echo "## T5 CLI argument parsing"
            echo ""
            echo "| outcome | mutants |"
            echo "| --- | --- |"
            for f in caught missed timeout unviable; do
              n=$(wc -l < "$out/$f.txt" 2>/dev/null || echo 0)
              echo "| $f | $n |"
            done
            if [ -s "$out/missed.txt" ]; then
              echo ""
              echo "### Surviving mutants"
              echo '```'
              cat "$out/missed.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-T5-cli-parsing
          path: mutants.out/T5
