            echo "dfe6dc37d0342c891d2829b5a695aa57c2d0edecef7e7d0399a30cc6e206411e  ${archive}" | sha256sum -c -
            mkdir -p "$HOME/.local/bin"
            tar -xzf "$archive" -C "$HOME/.local/bin" cargo-mutants
            "$HOME/.local/bin/cargo-mutants" --version
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          else
            cargo install cargo-mutants --version "$version" --locked
            cargo-mutants --version
          fi
      - name: Run mutation test T5 (CLI parsing)
        env:
          JEV_API_KEY: ${{ github.ref_protected && secrets.JEV_API_KEY || '' }}
        run: |
          cargo test --locked -p preloop-runner-server --features test-support --test mutation_targets -- \
            --ignored --exact t5_cli_parsing --nocapture
      - name: Report survivors
        if: always()
        run: |
          out=mutants.out/T5/mutants.out
          {
            echo "## T5 CLI argument parsing"
            echo ""
            echo "| outcome | mutants |"
            echo "| --- | --- |"
            for f in caught missed timeout unviable; do
              n=$(wc -l < "$out/$f.txt" 2>/dev/null || echo 0)
              echo "| $f | $n |"
            done
            if [ -s "$out/missed.txt" ]; then
              echo ""
              echo "### Surviving mutants"
              echo '```'
              cat "$out/missed.txt"
              echo '```'
            fi
            if [ -s "$(dirname "$out")/triage.md" ]; then
              echo ""
              echo "### Jev triage"
              cat "$(dirname "$out")/triage.md"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-T5-cli-parsing
          path: mutants.out/T5
      - name: Remove PostgreSQL container
        if: always()
        env:
          PG_NAME: postgres-${{ github.job }}-${{ github.run_id }}
        run: docker rm -f "$PG_NAME" || true
