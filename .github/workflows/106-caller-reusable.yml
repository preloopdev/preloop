name: 106-caller-reusable
on: workflow_dispatch
jobs:
  call-reusable:
    uses: ./.github/workflows/reusable.yml
    with:
      deploy-target: "staging"
      enable-flags: true

  verify:
    needs: call-reusable
    runs-on: self-hosted
    steps:
      - run: echo "Result: ${{ needs.call-reusable.outputs.status }}"
