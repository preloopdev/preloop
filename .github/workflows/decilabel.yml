name: GitHub Action Issue and PR Labeler
on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  issues: write
  pull-requests: write
concurrency:
  group: decilabel-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: EvanProgramming/decilabel@a1bbdd8b60d35ecdc82c99345e1141d41fc77f50 # v1.1.0
        with:
          provider: typesafe
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          model: typesafe/jev-1.13
          dry-run: "true"
