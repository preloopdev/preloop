name: server-conformance
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "45 3 * * *"

jobs:
  server-light:
    name: Server light conformance
    # Trusted contexts only. Fork PRs are untrusted code and must not run on
    # the self-hosted pool; they still get hosted ci.yml + supply-chain
    # coverage. Same-repo PRs, main pushes, and the nightly schedule run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Conformance goldens are LFS-tracked; without this they arrive
          # as pointer stubs and every test that reads them fails.
          lfs: true
      - uses: dtolnay/rust-toolchain@52699249a776424c51ebc9ee197baf0f9dbf0d8a
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
      - name: Replay official runner flows
        run: bash ./benchmarks/conformance/run.sh
      - name: Upload light report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-light-conformance
          path: |
            .runner-watch/conformance/**
            .runner-watch/conformance-report.md
          if-no-files-found: error

# The deep profile (official runner + pre-packed smolVM machines on the
# dedicated macOS host) is temporarily removed: no macOS executor is deployed
# right now, so the job would queue forever on every PR. Restore from git
# history once a `[self-hosted, macOS, ARM64, smolvm-host]` host exists.
