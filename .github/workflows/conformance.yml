name: server-conformance
permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
  schedule:
    - cron: "45 3 * * *"

jobs:
  server-light:
    name: Server light conformance
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          lfs: true
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Replay official runner flows
        run: bash ./benchmarks/conformance/run.sh
      - name: Upload light report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-light-conformance
          path: |
            .runner-watch/conformance/**
            .runner-watch/conformance-report.md
          if-no-files-found: error
