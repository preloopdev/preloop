name: server-conformance
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "45 3 * * *"

jobs:
  server-light:
    name: Server light conformance
    # Trusted contexts only. Fork PRs are untrusted code and must not run on
    # the self-hosted pool; they still get hosted ci.yml + supply-chain
    # coverage. Same-repo PRs, main pushes, and the nightly schedule run here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - name: Ensure git-lfs for LFS-tracked goldens
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq git-lfs
          fi
          git lfs install --skip-repo >/dev/null 2>&1 || true
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - name: Replay official runner flows
        run: bash ./benchmarks/conformance/run.sh
      - name: Upload light report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-light-conformance
          path: |
            .runner-watch/conformance/**
            .runner-watch/conformance-report.md
          if-no-files-found: error

# The deep profile (official runner + pre-packed smolVM machines on the
# dedicated macOS host) is temporarily removed: no macOS executor is deployed
# right now, so the job would queue forever on every PR. Restore from git
# history once a `[self-hosted, macOS, ARM64, smolvm-host]` host exists.
