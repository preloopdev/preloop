name: server-conformance
permissions:
  contents: read

env:
  CARGO_HOME: /home/runner/.cargo
  RUSTUP_HOME: /home/runner/.rustup

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches: [main]
  schedule:
    - cron: "45 3 * * *"

jobs:
  server-light:
    name: Server light conformance
    runs-on: [self-hosted, preloop-cpane]
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          lfs: true
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: 0.26.3
          s3-bucket: preloop-kache
          s3-endpoint: ${{ secrets.KACHE_R2_ENDPOINT }}
          s3-region: auto
          s3-access-key-id: ${{ secrets.KACHE_R2_ACCESS_KEY_ID }}
          s3-secret-access-key: ${{ secrets.KACHE_R2_SECRET_ACCESS_KEY }}
          # This job builds the server once; its own manifest-key keeps its
          # entries out of the ci.yml test plans.
          manifest-key: conformance
          min-compile-ms: 2000
          pr-comment: false
      - name: Replay configured official runner flows
        run: bash ./benchmarks/conformance/run.sh
      - name: Name the diverging scenarios
        if: failure()
        # `run.sh` prints only "conformance failed for N scenario(s)". The
        # scenario names live in conformance-fail.toml, which previously was
        # not uploaded either — so a red build could not be diagnosed at all
        # without re-running the replay locally. Echo them into the log, which
        # outlives the ephemeral runner VM.
        run: |
          if [ -f .runner-watch/conformance-fail.toml ]; then
            echo "::group::Diverging scenarios"
            cat .runner-watch/conformance-fail.toml
            echo "::endgroup::"
          else
            echo "no conformance-fail.toml written — the replay failed before the gate"
          fi
      - name: Upload light report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-light-conformance
          path: |
            .runner-watch/conformance/**
            .runner-watch/conformance-report.md
            .runner-watch/conformance-fail.toml
          if-no-files-found: error

  hosted-runtime-parity:
    name: Hosted runtime parity
    # Runs inside a real preloop guest on the cpane bench and asserts the
    # runtime a job sees there — process limits, sysctls, the machine's own
    # hostname, the step environment — against a real GitHub-hosted runner's
    # (values and provenance in fixtures/hosted-runtime-probe.sh, the same
    # script the fixture workflows run). It takes seconds and needs no network
    # beyond the checkout.
    #
    # This checks the DEPLOYED engine and golden, not the pull request's build:
    # the job's VM is provisioned by the bench's running engine, and nothing in
    # this workflow boots an engine built from the PR. A golden rebake or a
    # deployed-engine regression shows up here as a red check; the PR's own
    # binary is validated by the guest run recorded in the pull request body
    # (the macstudio/AgentENV harnesses rebuild from a branch and re-run this
    # same script).
    runs-on: [self-hosted, preloop-cpane]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Assert the guest's runtime matches a GitHub-hosted runner's
        run: sh fixtures/hosted-runtime-probe.sh
