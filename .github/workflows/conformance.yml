name: server-conformance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "45 3 * * *"

jobs:
  server-light:
    name: Server light conformance
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
      - uses: Swatinem/rust-cache@v2
      - name: Replay official runner flows
        run: bash ./benchmarks/conformance/run.sh
      - name: Upload light report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-light-conformance
          path: |
            .runner-watch/conformance/**
            .runner-watch/conformance-report.md
          if-no-files-found: error

# The deep profile (official runner + pre-packed smolVM machines on the
# dedicated macOS host) is temporarily removed: no macOS executor is deployed
# right now, so the job would queue forever on every PR. Restore from git
# history once a `[self-hosted, macOS, ARM64, smolvm-host]` host exists.            benchmarks/compatibility/server/protocol/captures/**
          if-no-files-found: error
