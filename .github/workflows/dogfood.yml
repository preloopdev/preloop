name: dogfood

on:
  push:
  pull_request:

# Runs against aksh locally. No checkout/toolchain actions — the repo is
# already on disk at AKSH_REPO_ROOT (injected by the harness as a variable).
# Steps run in the repo directory via `working-directory`.

jobs:
  rust:
    runs-on: self-hosted
    steps:
      - name: cargo check
        run: cargo check --workspace
      - name: cargo test
        run: cargo test --workspace --quiet
