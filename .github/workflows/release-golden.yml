name: release-golden

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to receive the generated assets (defaults to latest)
        required: false
        type: string
      reuse_previous_goldens:
        description: Copy existing goldens instead of rebuilding them
        required: false
        default: false
        type: boolean
      previous_release_tag:
        description: Release tag whose goldens should be reused
        required: false
        default: v0.29.5
        type: string

jobs:
  reuse-previous-goldens:
    name: Reuse Previous Golden Artifacts
    if: github.event_name == 'workflow_dispatch' && inputs.reuse_previous_goldens
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copy goldens to target release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.release_tag }}
          PREVIOUS_TAG: ${{ inputs.previous_release_tag }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          mkdir -p dist
          gh release download "$PREVIOUS_TAG" \
            --pattern 'preloop-ubuntu-24.04-*' \
            --dir dist \
            --repo "$GITHUB_REPOSITORY"
          gh release upload "$TARGET_TAG" \
            dist/preloop-ubuntu-24.04-aarch64 \
            dist/preloop-ubuntu-24.04-aarch64.sha256 \
            dist/preloop-ubuntu-24.04-x86_64 \
            dist/preloop-ubuntu-24.04-x86_64.sha256 \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

  build-and-publish-linux-binaries:
    name: Build Linux ${{ matrix.arch }} release
    if: github.event_name == 'release'
    # Cross-compilation needs no KVM. Keep the scarce self-hosted executor
    # available for the golden VM build and the repository's normal CI.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          # Pin the workspace toolchain: the action's `stable` default does
          # not reliably install the cross std on self-hosted runners
          # (E0463: can't find crate for `core`).
          toolchain: "1.97"
          targets: ${{ matrix.target }}

      - name: Set up Zig cross toolchain
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406
        with:
          version: 0.14.1

      # Prebuilt binary: `cargo install` rebuilt this from source on every
      # release run for no benefit.
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Build release binaries
        run: |
          cargo zigbuild --release \
            --target ${{ matrix.target }} \
            -p preloop-cli \
            -p preloop-runner-server \
            -p preloop-runner
          mkdir -p dist/preloop-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/preloop \
            target/${{ matrix.target }}/release/preloop-server \
            target/${{ matrix.target }}/release/preloop-runner \
            dist/preloop-${{ matrix.arch }}/
          tar -C dist -czf \
            dist/preloop-${{ matrix.arch }}-linux-musl.tar.gz \
            preloop-${{ matrix.arch }}
          sha256sum dist/preloop-${{ matrix.arch }}-linux-musl.tar.gz \
            > dist/preloop-${{ matrix.arch }}-linux-musl.tar.gz.sha256

      - name: Upload Linux binaries to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            "dist/preloop-${{ matrix.arch }}-linux-musl.tar.gz" \
            "dist/preloop-${{ matrix.arch }}-linux-musl.tar.gz.sha256" \
            --clobber

  build-and-publish-golden:
    name: Build & Publish Golden MicroVM Artifact
    # Binary-only hotfixes can retain the previous golden. Add the hidden
    # `preloop:skip-golden` marker to the release notes for those releases.
    if: (github.event_name == 'workflow_dispatch' && !inputs.reuse_previous_goldens) || (github.event_name == 'release' && !contains(github.event.release.body, '<!-- preloop:skip-golden -->'))
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c

      - name: Build Preloop binaries
        run: |
          cargo build --release -p preloop-cli -p preloop-runner-server
          case $(uname -m) in
            x86_64) RUNNER_TARGET=x86_64-unknown-linux-gnu; GOLDEN_ARCH=x86_64 ;;
            aarch64|arm64) RUNNER_TARGET=aarch64-unknown-linux-gnu; GOLDEN_ARCH=aarch64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          cargo build --release -p preloop-runner --target "$RUNNER_TARGET"
          echo "GOLDEN_ARCH=$GOLDEN_ARCH" >> "$GITHUB_ENV"
          echo "RUNNER_TARGET=$RUNNER_TARGET" >> "$GITHUB_ENV"

      - name: Pack Golden MicroVM Artifact
        env:
          GOLDEN_NAME: preloop-ubuntu-24.04-${{ env.GOLDEN_ARCH }}
        run: |
          mkdir -p dist
          rm -f "dist/$GOLDEN_NAME"
          ./target/release/preloop build-golden \
            --runner-bundle "target/$RUNNER_TARGET/release" \
            --output "dist/$GOLDEN_NAME"
          test -s "dist/$GOLDEN_NAME"
          sha256sum "dist/$GOLDEN_NAME" > "dist/$GOLDEN_NAME.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature (Fulcio + Rekor) on the pack blob, verified against
      # this workflow's own OIDC identity before upload. Consumers verify
      # with: cosign verify-blob --bundle <pack>.bundle <pack>
      - name: Sign golden (cosign keyless)
        env:
          GOLDEN_NAME: preloop-ubuntu-24.04-${{ env.GOLDEN_ARCH }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "dist/$GOLDEN_NAME.bundle" "dist/$GOLDEN_NAME"
          cosign verify-blob \
            --bundle "dist/$GOLDEN_NAME.bundle" \
            --certificate-identity-regexp \
              "^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-golden.yml@refs/(heads/main|tags/)" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "dist/$GOLDEN_NAME"

      # GitHub-signed SLSA provenance for the pack; consumers verify with:
      # gh attestation verify <pack> --repo preloopdev/preloop
      - name: Attest golden (GitHub provenance)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/preloop-ubuntu-24.04-${{ env.GOLDEN_ARCH }}

      - name: Upload Golden Artifact to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOLDEN_NAME: preloop-ubuntu-24.04-${{ env.GOLDEN_ARCH }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TARGET_TAG="${EVENT_TAG:-$REQUESTED_TAG}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          gh release upload "$TARGET_TAG" \
            "dist/$GOLDEN_NAME" "dist/$GOLDEN_NAME.sha256" \
            "dist/$GOLDEN_NAME.bundle" --clobber

      # A dispatched build has no release to upload to; without this the
      # golden would sit only on the runner's workspace and be lost. Keep it
      # as a downloadable workflow artifact so the pool can be updated from
      # the run page.
      - name: Retain Golden Artifact for non-release builds
        if: github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: golden-${{ env.GOLDEN_ARCH }}
          path: |
            dist/preloop-ubuntu-24.04-${{ env.GOLDEN_ARCH }}
            dist/preloop-ubuntu-24.04-${{ env.GOLDEN_ARCH }}.sha256
            dist/preloop-ubuntu-24.04-${{ env.GOLDEN_ARCH }}.bundle
          retention-days: 90
          if-no-files-found: error

  # The aarch64 golden can only be built on an arm64 host (the guest VM runs
  # on the host's own architecture). GitHub-hosted Apple Silicon runners do
  # not support nested virtualization, so this must run on a bare-metal
  # self-hosted Mac with Hypervisor.framework access.
  build-and-publish-golden-macos:
    name: Build & Publish aarch64 Golden (macOS)
    if: (github.event_name == 'workflow_dispatch' && !inputs.reuse_previous_goldens) || (github.event_name == 'release' && !contains(github.event.release.body, '<!-- preloop:skip-golden -->'))
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.97"
          targets: aarch64-unknown-linux-gnu

      - name: Set up Zig cross toolchain
        uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Build Preloop CLI
        run: |
          cargo build --release -p preloop-cli -p preloop-runner-server

      - name: Build Linux runner bundle
        run: |
          cargo zigbuild --release \
            --target aarch64-unknown-linux-gnu \
            -p preloop-runner

      - name: Install pinned smolvm
        env:
          SMOLVM_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          ARCHIVE="smolvm-${SMOLVM_VERSION}-darwin-arm64.tar.gz"
          BASE="https://github.com/smol-machines/smolvm/releases/download/v${SMOLVM_VERSION}"
          curl -fsSL -o "$ARCHIVE" "$BASE/$ARCHIVE"
          curl -fsSL -o checksums.sha256 "$BASE/checksums.sha256"
          grep -F "$ARCHIVE" checksums.sha256 | shasum -a 256 -c -
          tar -xzf "$ARCHIVE"
          SRC="smolvm-${SMOLVM_VERSION}-darwin-arm64"
          mkdir -p "$HOME/.smolvm"
          rm -rf "$HOME/.smolvm/lib"
          cp -R "$SRC/lib" "$HOME/.smolvm/lib"
          # Copy whichever storage/overlay template format the archive
          # carries (mirrors the update installer, which copies only files
          # that exist).
          for f in smolvm smolvm-bin storage-template.ext4 overlay-template.ext4 \
              storage-template.ext4.zst overlay-template.ext4.zst; do
            [ -f "$SRC/$f" ] && cp "$SRC/$f" "$HOME/.smolvm/"
          done
          echo "$SMOLVM_VERSION" > "$HOME/.smolvm/.version"
          mkdir -p "$HOME/Library/Application Support/smolvm"
          rm -rf "$HOME/Library/Application Support/smolvm/agent-rootfs"
          cp -R "$SRC/agent-rootfs" "$HOME/Library/Application Support/smolvm/agent-rootfs"
          mkdir -p "$HOME/.local/bin"
          ln -sf "$HOME/.smolvm/smolvm" "$HOME/.local/bin/smolvm"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install ext4 filesystem tools
        run: |
          brew install e2fsprogs
          echo "$(brew --prefix e2fsprogs)/sbin" >> "$GITHUB_PATH"

      - name: Pack Golden MicroVM Artifact
        env:
          GOLDEN_NAME: preloop-ubuntu-24.04-aarch64
        run: |
          mkdir -p dist
          rm -f "dist/$GOLDEN_NAME"
          ./target/release/preloop build-golden \
            --runner-bundle "target/aarch64-unknown-linux-gnu/release" \
            --output "dist/$GOLDEN_NAME"
          test -s "dist/$GOLDEN_NAME"
          shasum -a 256 "dist/$GOLDEN_NAME" > "dist/$GOLDEN_NAME.sha256"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature (Fulcio + Rekor) on the pack blob, verified against
      # this workflow's own OIDC identity before upload. Consumers verify
      # with: cosign verify-blob --bundle <pack>.bundle <pack>
      - name: Sign golden (cosign keyless)
        env:
          GOLDEN_NAME: preloop-ubuntu-24.04-aarch64
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle "dist/$GOLDEN_NAME.bundle" "dist/$GOLDEN_NAME"
          cosign verify-blob \
            --bundle "dist/$GOLDEN_NAME.bundle" \
            --certificate-identity-regexp \
              "^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release-golden.yml@refs/(heads/main|tags/)" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "dist/$GOLDEN_NAME"

      # GitHub-signed SLSA provenance for the pack; consumers verify with:
      # gh attestation verify <pack> --repo preloopdev/preloop
      - name: Attest golden (GitHub provenance)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/preloop-ubuntu-24.04-aarch64

      - name: Upload Golden Artifact to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOLDEN_NAME: preloop-ubuntu-24.04-aarch64
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          TARGET_TAG="${EVENT_TAG:-$REQUESTED_TAG}"
          if [ -z "$TARGET_TAG" ]; then
            TARGET_TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          gh release upload "$TARGET_TAG" \
            "dist/$GOLDEN_NAME" "dist/$GOLDEN_NAME.sha256" \
            "dist/$GOLDEN_NAME.bundle" --clobber

      - name: Retain Golden Artifact for non-release builds
        if: github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: golden-aarch64
          path: |
            dist/preloop-ubuntu-24.04-aarch64
            dist/preloop-ubuntu-24.04-aarch64.sha256
            dist/preloop-ubuntu-24.04-aarch64.bundle
          retention-days: 90
          if-no-files-found: error
