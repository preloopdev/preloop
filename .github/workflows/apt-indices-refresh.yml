name: apt-indices-refresh

# Weekly freshness reminder for golden apt indices. Pack production stamps each
# bake (marker in the image, `apt_indices` in provenance.json); this job
# compares the published pack's stamp against the versions.toml policy. When
# stale, it opens a draft PR asking an operator to rebuild on a host with enough
# disk. The schedule never dispatches the hosted golden bake.
on:
  schedule:
    # Monday 04:00 UTC: at most one reminder per week when indices exceed policy.
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    name: Open draft PR when golden apt indices are stale
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          sparse-checkout: versions.toml

      - name: Check published index freshness
        id: freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MAX_AGE_DAYS="$(grep '^apt_indices_max_age_days' versions.toml | cut -d'"' -f2)"
          test -n "$MAX_AGE_DAYS"
          TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "policy: ${MAX_AGE_DAYS}d; latest release: $TAG"
          rm -rf /tmp/apt-prov
          if gh release download "$TAG" \
            --pattern 'preloop-ubuntu-24.04-x86_64.provenance.json' \
            --dir /tmp/apt-prov \
            --clobber \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            STAMP="$(python3 -c 'import json; print(json.load(open("/tmp/apt-prov/preloop-ubuntu-24.04-x86_64.provenance.json")).get("apt_indices", {}).get("baked_at", ""))')"
          else
            echo "no provenance asset; treating pack as stale"
            STAMP=""
          fi
          if [ -z "$STAMP" ]; then
            {
              echo "stale=true"
              echo "stamp=missing"
              echo "age_days=unknown"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE_DAYS="$(( ($(date -u +%s) - $(date -u -d "$STAMP" +%s)) / 86400 ))"
          echo "indices baked $STAMP (${AGE_DAYS}d old)"
          {
            echo "stamp=$STAMP"
            echo "age_days=$AGE_DAYS"
          } >> "$GITHUB_OUTPUT"
          if [ "$AGE_DAYS" -gt "$MAX_AGE_DAYS" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "fresh; nothing to do"
          fi

      - name: Open manual rebuild reminder
        if: steps.freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_INDEX_STAMP: ${{ steps.freshness.outputs.stamp }}
          APT_INDEX_AGE_DAYS: ${{ steps.freshness.outputs.age_days }}
        run: |
          set -euo pipefail
          REQUESTED_AT="$(date -u +%F)"
          BRANCH="chore/golden-apt-refresh-${REQUESTED_AT}"
          EXISTING_URL="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --head "$BRANCH" \
            --json url \
            --jq '.[0].url // empty')"
          if [ -n "$EXISTING_URL" ]; then
            echo "rebuild reminder already open: $EXISTING_URL"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          awk -v marker="# Golden rebuild requested ${REQUESTED_AT}: apt indices ${APT_INDEX_STAMP} (${APT_INDEX_AGE_DAYS}d old)." '
            /^# Golden rebuild requested / { next }
            /^apt_indices_max_age_days = / { print marker }
            { print }
          ' versions.toml > versions.toml.tmp
          mv versions.toml.tmp versions.toml
          git add versions.toml
          git commit -m "chore(golden): request apt index refresh [skip ci]"
          gh auth setup-git
          git fetch origin "$BRANCH" || true
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

          BODY="$RUNNER_TEMP/golden-refresh-pr.md"
          cat > "$BODY" <<EOF
          ## Manual golden rebuild required

          The published x86_64 golden reports apt indices baked at
          **${APT_INDEX_STAMP}** (${APT_INDEX_AGE_DAYS} days old), beyond the
          policy in versions.toml.

          This draft PR is a reminder only; do not merge it.

          1. On the x86_64 Linux host with KVM and sufficient disk, run
             scripts/build-golden-x86_64.sh from current main.
          2. Publish the payload, checksum, bundle, signatures, and provenance
             sidecars to the current release.
          3. Confirm the published provenance has a fresh apt_indices.baked_at.
          4. Close this draft PR.
          EOF

          if ! gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "chore(golden): rebuild stale apt indices [skip preloop]" \
            --body-file "$BODY"; then
            EXISTING_URL="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --head "$BRANCH" \
              --json url \
              --jq '.[0].url // empty')"
            test -n "$EXISTING_URL"
            echo "concurrent reminder already opened: $EXISTING_URL"
          fi
