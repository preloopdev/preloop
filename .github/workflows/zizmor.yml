name: zizmor
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  zizmor:
    name: GitHub Actions Security Analysis with zizmor
    runs-on: [self-hosted, preloop-cpane]
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Run zizmor
        run: uvx zizmor .github/workflows/

      # zizmor checks that actions are SHA-pinned; this checks that the
      # `# <ref>` comment beside each SHA is true. Renovate reads that comment
      # to decide what the pin is, and silently skips any pin without one, so a
      # missing or stale comment freezes the action with no signal.
      - name: Verify action pin comments match their SHAs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-action-pins.py .github/workflows
