name: zizmor
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  zizmor:
    name: GitHub Actions Security Analysis with zizmor
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Run zizmor
        run: uvx zizmor .github/workflows/

      # zizmor checks that actions are SHA-pinned; this checks that the
      # `# <ref>` comment beside each SHA is true. Renovate reads that comment
      # to decide what the pin is, and silently skips any pin without one, so a
      # missing or stale comment freezes the action with no signal. Eight pins
      # were frozen this way before this check existed.
      - name: Verify action pin comments match their SHAs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-action-pins.py .github/workflows
