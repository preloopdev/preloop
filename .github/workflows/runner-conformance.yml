name: runner-conformance
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  runner-light:
    name: Runner light conformance
    # Trusted contexts only (see server-conformance): fork PR code never
    # executes on the self-hosted pool.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Ensure git-lfs for LFS-tracked goldens
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            case $(uname -m) in
              aarch64|arm64) LFS_ARCH=arm64 ;;
              x86_64) LFS_ARCH=amd64 ;;
              *) echo "unsupported arch" >&2; exit 1 ;;
            esac
            curl -fsSL "https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-$LFS_ARCH-v3.7.1.tar.gz" -o /tmp/git-lfs.tgz
            tar -xzf /tmp/git-lfs.tgz -C /tmp
            mkdir -p "$HOME/bin"
            cp /tmp/git-lfs-3.7.1/git-lfs "$HOME/bin/git-lfs"
            chmod +x "$HOME/bin/git-lfs"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          git lfs install --skip-repo >/dev/null 2>&1 || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - name: Validate runner status responses
        run: python3 benchmarks/real-world/runner-conformance.py --mode light
      - name: Upload light report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-light-conformance
          path: benchmarks/compatibility/runner/behavior/RUNNER-CONFORMANCE-REPORT.md
          if-no-files-found: error

  # The deep profile needs the repository's pre-packed smolVM machines,
  # macOS/ARM64 host, gh credentials, and official runner cache. The host-only
  # variable is also the explicit opt-in: webhook CI runs inside disposable
  # Linux guests and must not try to launch nested host smolVMs. Once enabled,
  # a missing or failed prerequisite fails instead of degrading to light.
  runner-deep:
    name: Runner deep conformance
    # This job builds and runs PR code on a macOS host WITH a GH token
    # secret, so fork PRs are hard-excluded: only same-repo PRs (write
    # access), pushes, schedule, and manual runs may trigger it.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNNER_CONFORMANCE_HOST_WORKSPACE != ''
    runs-on: [self-hosted, macOS, ARM64, smolvm-host]
    timeout-minutes: 180
    env:
      GH_REPO: ${{ vars.RUNNER_CONFORMANCE_REPO || 'preloopdev/aksh-conformance' }}
      GH_TOKEN: ${{ secrets.RUNNER_CONFORMANCE_TOKEN }}
      HOST_WORKSPACE: ${{ vars.RUNNER_CONFORMANCE_HOST_WORKSPACE || '' }}
      AKSH_RUNNER_HOST: ${{ github.workspace }}/target/aarch64-unknown-linux-musl/release/preloop-runner
    steps:
      - name: Ensure git-lfs for LFS-tracked goldens
        run: |
          if ! command -v git-lfs >/dev/null 2>&1; then
            case $(uname -m) in
              aarch64|arm64) LFS_ARCH=arm64 ;;
              x86_64) LFS_ARCH=amd64 ;;
              *) echo "unsupported arch" >&2; exit 1 ;;
            esac
            curl -fsSL "https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-$LFS_ARCH-v3.7.1.tar.gz" -o /tmp/git-lfs.tgz
            tar -xzf /tmp/git-lfs.tgz -C /tmp
            mkdir -p "$HOME/bin"
            cp /tmp/git-lfs-3.7.1/git-lfs "$HOME/bin/git-lfs"
            chmod +x "$HOME/bin/git-lfs"
            echo "$HOME/bin" >> "$GITHUB_PATH"
          fi
          git lfs install --skip-repo >/dev/null 2>&1 || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          lfs: true
      - name: Build current PR runner for smolVM
        run: cargo zigbuild -p aksh-runner --release --target aarch64-unknown-linux-musl
      - name: Run deep runner conformance
        run: |
          rm -f benchmarks/compatibility/runner/behavior/conformance-{aksh,official}.jsonl
          bash ./benchmarks/real-world/batch-conformance.sh both '10[1-9]-*' '11[0-5]-*'
          python3 benchmarks/real-world/runner-conformance.py --mode deep
      - name: Upload deep report and captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runner-deep-conformance
          path: |
            benchmarks/compatibility/runner/behavior/RUNNER-CONFORMANCE-REPORT.md
            benchmarks/compatibility/runner/behavior/conformance-*.jsonl
            benchmarks/compatibility/runner/behavior/vm-*.log
          if-no-files-found: error
