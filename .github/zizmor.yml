# Configuration for zizmor static analysis tool
# https://docs.zizmor.sh/configuration/

rules:
  # release.yml is autogenerated by cargo-dist (axodotdev/cargo-dist)
  template-injection:
    ignore:
      - release.yml
  excessive-permissions:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  # pullfrog.yml runs on issue_comment by design: it is a review bot that
  # only fires on `/pullfrog review` from a comment, and its job filter also
  # refuses renovate/dependabot/pullfrog actors. zizmor 1.31 flags the
  # trigger itself; the workflow's guard is the control.
  dangerous-triggers:
    ignore:
      - pullfrog.yml

  # docs.yml installs the Mintlify CLI with `npm install mint@4.2.1046` in
  # a throwaway $RUNNER_TEMP prefix: the package is exact-version-pinned,
  # never committed, and not part of the workspace's lockfile. A lockfile
  # for a single tool installed per run buys nothing here.
  adhoc-packages:
    ignore:
      - docs.yml