name: Bug report
description: Something misbehaves, or preloop diverges from the official runner
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. If you suspect a **divergence from the official
        runner**, the fastest path to a fix is a reproduction that shows what
        the official runner does — preloop's compatibility target is
        `actions/runner` v2.336.0 (see `versions.toml`).

  - type: input
    id: version
    attributes:
      label: preloop version
      description: "`preloop --version`, commit SHA, or release tag"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform
      description: Host OS/arch (e.g. macOS arm64, Linux x86_64) and runner mode (host, VM pool, registered runner)
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: The behavior you expect (including which jobs/steps should run and in what order)
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happens
      description: Error messages, wrong step order/conclusions, missing runs, protocol failures
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        A minimal workflow file (or a link to a repo) plus the exact command
        line used. Include the event (`push`, `pull_request`, …) and any
        `runs-on` labels.
    validations:
      required: true

  - type: textarea
    id: official
    attributes:
      label: What does the official runner do?
      description: |
        If you believe this is a divergence, run the **same workflow** against
        GitHub-hosted runners or the official runner binary, and record the
        difference. Two ways to record:

        **Easy (no tooling):** run the workflow on GitHub (or with the
        official runner binary) and paste `gh run view --log <run-id>` — job
        and step names, order, and conclusions.

        **Wire-accurate (recommended for protocol issues):** the repo ships
        `runner-watch`, which records the official runner's exact
        request/response exchange and replays it against preloop:

        ```
        runner-watch record-golden --runner /path/to/actions-runner --scenario <name>
        runner-watch conform --runner 2.336.0 --preloop-url http://127.0.0.1:9090
        ```

        Attach the generated `.runner-watch/golden/v2.336.0/<scenario>/flows.jsonl`
        and the `conform` output. The pinned compatibility target is in
        `versions.toml` (v2.336.0).

        A reproduction that includes the official behavior is what makes a
        divergence report reviewable.
    validations:
      required: false

  - type: dropdown
    id: protocol
    attributes:
      label: Does this touch the runner protocol interface?
      options:
        - "No"
        - "Yes — registration/`/_apis/...` messages"
        - "Yes — broker / Twirp results-service protocol"
        - "Not sure"
      description: Runner registration, job messages, check runs, results/artifacts Twirp, NDJSON events
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Server/runner logs with secrets redacted. If the bug is a protocol
        divergence, the raw exchange is more useful than a summary.
    validations:
      required: false
